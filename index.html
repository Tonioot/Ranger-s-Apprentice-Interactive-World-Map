/* ================== reliëf, begroeiing en rivieren ==================
   Tot hier is de kaart een verzameling egale vlakken. Wat hieronder staat
   maakt er land van, en het doet dat in twee soorten werk:

     als bitmap   licht, schaduw, hoogtekleur en de korrel van de begroeiing.
                  Dat loopt vloeiend in elkaar over en is in lijnen niet te
                  vangen; het wordt één keer uitgerekend en als plaatje op de
                  kaart gelegd.
     als vector   kust, grenzen, rivieren, namen. Dat moet scherp blijven bij
                  elke zoomstap, dus dat blijft tekenwerk.

   Hier stonden eerder ook getekende bergjes en boompjes over het land. Die
   zijn eruit: van bovenaf zie je geen boom maar een bos, en dat is een kleur
   met een korrel, geen tekentje. Het scheelde bovendien bijna zesduizend losse
   vormen die bij elke schuifbeweging opnieuw getekend moesten worden.

   Waar het reliëf op stoelt: het land loopt vanaf de kust omhoog, en hoe ver
   het omhoog gaat en hoe grillig het wordt staat per gebied in data.json onder
   terrein. Daar bovenop komt ruis — bij bergland ruis met scherpe kammen, wat
   bergketens geeft in plaats van bulten. Uit dat hoogteveld volgt daarna al het
   andere vanzelf: de schaduw, de rotskleur, de sneeuw op de toppen en welke
   kant de rivieren op lopen.

   Het gebeurt na het opbouwen van de kaart, niet ervoor: je ziet meteen een
   kaart, en het reliëf komt er een ogenblik later overheen.               */

const RELIEF={               /* hoe hoog het land wordt, en hoe grillig */
  vlak:     {amp:.20, rug:.10},
  heuvels:  {amp:.50, rug:.34},
  hoogland: {amp:.70, rug:.56},
  bergen:   {amp:1,   rug:.86}
};
/* Elke begroeiing heeft een kleur voor het lichte en voor het donkere thema,
   en een korrel: hoe grof het oppervlak eruitziet. Een naaldwoud is van boven
   gezien een dek van kruinen met schaduw ertussen en is dus grof; een akker of
   een steppe is glad. Die korrel is wat een vlak van groene verf tot bos maakt
   — er staan geen boompjes op de kaart, er staat bos.

   vlek gaat over de grovere afwisseling: open plekken in een woud, droge
   stukken op de steppe, kleuren die per streek een tikje verschillen. */
const GROEI={
  akker:   {licht:"#D2CE96", donker:"#454F2F", korrel:.10, vlek:.13},
  grasland:{licht:"#C0C88C", donker:"#3E4B2F", korrel:.09, vlek:.11},
  steppe:  {licht:"#BFC985", donker:"#414E30", korrel:.10, vlek:.14},
  heide:   {licht:"#B3A88E", donker:"#443F35", korrel:.16, vlek:.16},
  loofbos: {licht:"#84A05C", donker:"#2C3E24", korrel:.32, vlek:.18},
  naaldbos:{licht:"#688B5E", donker:"#26362A", korrel:.36, vlek:.19},
  jungle:  {licht:"#6E9C4B", donker:"#24391F", korrel:.40, vlek:.20},
  woestijn:{licht:"#E7D8A2", donker:"#564B31", korrel:.14, vlek:.16},
  moeras:  {licht:"#94A67E", donker:"#2C3A2B", korrel:.24, vlek:.22},
  toendra: {licht:"#C6C6AC", donker:"#464A3C", korrel:.11, vlek:.12},
  kaal:    {licht:"#C2B698", donker:"#4A4735", korrel:.18, vlek:.15}
};
const STD_TERREIN={relief:"heuvels",begroeiing:"grasland"};
/* Een vorm uit world.svg hoort bij een gebied, of — zoals Skorghijl — bij een
   losse plaats. Beide mogen een terrein hebben. */
function terreinVan(id){
  const m=GEBIEDEN[id]||PLAATSEN.find(p=>p.vorm===id);
  const t=m&&m.terrein;
  if(!t)return STD_TERREIN;
  return t;
}

/* ---- ruis ----
   Waardenruis: een vast rooster van willekeurige getallen met zachte
   overgangen ertussen. Het getal hangt alleen van de plek af, dus de bergen
   staan na een verversing weer precies waar ze stonden. Met rug erbij worden
   de dalen omgeklapt naar kammen: dat is wat een bergketen een rug geeft in
   plaats van een reeks losse bulten. */
/* Twee getallen door elkaar husselen tot één getal tussen nul en één. Er wordt
   twee keer gemengd: bij één ronde blijft er verband tussen buurpunten over, en
   dat verband tekent zich op de kaart af als een patroon. */
function hash2(x,y){
  let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263);
  h=Math.imul(h^h>>>15,2246822519);
  h=Math.imul(h^h>>>13,3266489917);
  return ((h^h>>>16)>>>0)/4294967296;
}
const soep=t=>t*t*(3-2*t);
/* Voor de ruis is soep() niet zacht genoeg. De helling ervan loopt wel door,
   maar knikt op elke roosterlijn — en de schaduw op de kaart is niets anders
   dan een meting van de helling, dus die knik wordt zichtbaar als een ruitjes-
   patroon over het hele land. Deze overgang knikt ook niet: hij begint en
   eindigt niet alleen vlak, maar ook zonder kromming. */
const zeepzacht=t=>t*t*t*(t*(t*6-15)+10);
function ruis(x,y){
  const x0=Math.floor(x),y0=Math.floor(y);
  const fx=zeepzacht(x-x0),fy=zeepzacht(y-y0);
  const a=hash2(x0,y0),b=hash2(x0+1,y0),c=hash2(x0,y0+1),d=hash2(x0+1,y0+1);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;
}
/* Elke laag is twee keer zo fijn en telt minder zwaar mee dan de vorige. Hoe
   ruw het terrein is bepaalt hóéveel minder: in bergland blijven de fijne
   lagen meetellen, wat rotsig oplevert; op de steppen sterven ze snel uit en
   blijft het glooiend. Zonder die fijne lagen wordt een klein land als Araluen
   één vage veeg — daar passen nog geen twee golven van de grofste laag in. */
/* Elke laag krijgt een eigen draaiing en verschuiving mee. Zonder dat liggen
   de roosters van alle lagen op dezelfde assen en met hetzelfde nulpunt, en
   dan vallen hun randen samen tot een streepjespatroon dat als corduroy over
   het land ligt. Gedraaid vallen ze nergens meer samen. */
const LAAG=[[1,0,0,0],[.6235,.7818,37.1,11.7],[-.2225,.9749,-19.3,63.4],
            [-.9010,.4339,71.9,-42.6],[-.9010,-.4339,-55.2,28.8],
            [-.2225,-.9749,13.6,-77.1],[.6235,-.7818,88.4,52.3]];
function fbm(x,y,lagen,rug){
  const val=.45+.17*rug;
  let som=0,gew=1,tot=0,f=1;
  for(let i=0;i<lagen;i++){
    const L=LAAG[i%LAAG.length];
    let n=ruis((x*L[0]-y*L[1])*f+L[2],(x*L[1]+y*L[0])*f+L[3]);
    /* Kammen zitten alleen in de grove lagen. Een kam is een vouw in het
       landschap: op de schaal van een bergketen hoort die er, maar in de
       fijnste lagen wordt het een net van haarscherpe vouwtjes, en dat leest
       als een streepjespatroon in plaats van als rots. */
    if(rug>0&&i<3)n+=((1-Math.abs(n*2-1))-n)*rug;
    som+=n*gew; tot+=gew; gew*=val; f*=2.07;
  }
  return som/tot;
}
/* Ruis in twee vaste fijnheden, en daartussen overgevloeid.

   Waarom niet gewoon de gewenste fijnheid per punt in de coördinaat
   vermenigvuldigen — ruis(x*f, y*f) met f dat plaatselijk oploopt? Omdat de
   plek in het ruispatroon dan x·f is, en de kaart is duizend eenheden breed.
   Een verandering in f van een duizendste verschuift het patroon aan de
   overkant van de kaart al over een hele roostercel. Zo'n f loopt op tussen
   twee roosterpunten en dat gaat dus schoksgewijs: het patroon verspringt op
   elke roosterlijn, en het land kwam onder een corduroy van fijne ribbels te
   liggen die de schaduw genadeloos uitvergrootte.

   Met twee vaste fijnheden staat het patroon overal stil en is er alleen nog
   overgevloeid tussen twee stilstaande patronen. Waar de fijnheid aan een van
   beide uiteinden zit — en dat is verreweg het meeste land — hoeft er maar één
   uitgerekend te worden, dus het kost bijna niets extra. */
function landruis(x,y,fijn,basis,lagen,rug){
  const f0=basis*.75, f1=basis*2.6, t=(fijn-.75)/1.85;
  if(t<=0)return fbm(x*f0,y*f0,lagen,rug);
  if(t>=1)return fbm(x*f1,y*f1,lagen,rug);
  const a=fbm(x*f0,y*f0,lagen,rug), b=fbm(x*f1,y*f1,lagen,rug);
  return a+(b-a)*t;
}
/* Een veld van het grovere terreinrooster aflezen tussen de vier omliggende
   punten in. Puntsgewijs aflezen is niet genoeg: deze velden bepalen mede de
   vórm van de ruis — hoe hoog, hoe ruig, hoe grof — en een sprongetje in zo'n
   veld verspringt het hele ruispatroon eronder. Op elke roosterlijn kwam er zo
   een randje, en samen vormden die een ruitjespatroon dat de schaduw netjes
   uitvergrootte. Met een zachte overgang is er niets meer om te verspringen. */
function tussen(f,a,b,c,d,w0,w1,w2,w3){ return f[a]*w0+f[b]*w1+f[c]*w2+f[d]*w3; }
/* doosvervaging, in twee vegen; hiermee lopen de terreinen van buurlanden in
   elkaar over in plaats van met een klif op de grens te botsen */
function veeg(a,w,h,r){
  const t=new Float32Array(a.length), n=2*r+1;
  const kx=x=>x<0?0:x>w-1?w-1:x, ky=y=>y<0?0:y>h-1?h-1:y;
  for(let y=0;y<h;y++){
    const o=y*w; let som=0;
    for(let x=-r;x<=r;x++)som+=a[o+kx(x)];
    for(let x=0;x<w;x++){ t[o+x]=som/n; som+=a[o+kx(x+r+1)]-a[o+kx(x-r)]; }
  }
  for(let x=0;x<w;x++){
    let som=0;
    for(let y=-r;y<=r;y++)som+=t[x+w*ky(y)];
    for(let y=0;y<h;y++){ a[y*w+x]=som/n; som+=t[x+w*ky(y+r+1)]-t[x+w*ky(y-r)]; }
  }
}
const hexRGB=s=>{
  s=s.trim().replace("#","");
  if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  const n=parseInt(s,16);
  return [n>>16&255,n>>8&255,n&255];
};

/* ---- het rekenwerk ---- */
/* RES is het aantal rasterpunten per kaarteenheid van het reliëf. Hoger is
   scherper bij het inzoomen en kost evenredig meer rekentijd en geheugen; op
   3 blijft het onder de seconde en is het tot een stap of vier inzoomen mooi.
   Het is het enige getal dat je hoeft te veranderen als je dat anders wilt. */
let hoogte=null, RW=0, RH=0, landvlak=null;
const RES=3;

/* De hooggebergte die van de noordkust van Skandia, langs de bergpas boven
   Hallasholm, door Teutland naar Alpina loopt — een eigen kronkelende rug,
   los van de gebiedsgrenzen, zodat hij er als één keten uitziet in plaats
   van als aparte vlekken per land. Punten in world.svg-maat. */
const BERGKETENS=[
  {punten:[
    [230,232,20],[230,226,22],[252,244,20],[264,259,16],
    [278,276,13],[290,299,11],[302,314,9],[317,331,9],[328,354,9]
  ]}
];
function afstandTotKeten(wx,wy){
  let dmin=Infinity;
  for(const keten of BERGKETENS){
    const pts=keten.punten;
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay,ar]=pts[i], [bx,by,br]=pts[i+1];
      const dx=bx-ax, dy=by-ay;
      const len=Math.hypot(dx,dy), len2=dx*dx+dy*dy;
      let t=len2>0?((wx-ax)*dx+(wy-ay)*dy)/len2:0;
      t=t<0?0:t>1?1:t;
      let px=ax+t*dx, py=ay+t*dy;
      /* een rechte rug tussen twee punten oogt als een liniaal; deze golf
         schuift het punt zijdelings, deterministisch (dezelfde vorm bij elke
         herberekening) en continu langs de hele keten — de ruis wordt
         gelezen op de lijn zelf (niet per segment apart), zodat er geen
         sprong ontstaat waar het ene segment in het andere overgaat */
      if(len>0){
        const nx=-dy/len, ny=dx/len;
        const golf=(fbm(px*.028,py*.028,2,.2)-.5)*2;
        px+=nx*golf*9; py+=ny*golf*9;
      }
      const breed=ar+(br-ar)*t;
      const d=Math.hypot(wx-px,wy-py)-breed;
      if(d<dmin)dmin=d;
    }
  }
  return Math.max(0,dmin);
}

/* ---- cache voor het gekleurde reliëf ----
   Het duurste deel van bouwGrond is niet het hoogteveld maar de kleuring
   erna: per rasterpunt licht, hoogtekleur, sneeuw en begroeiing uitrekenen
   en naar een PNG schilderen. Die PNG hangt alleen af van de landvormen, het
   terrein en de kleurstelling (licht/donker) — verandert daar niets aan, dan
   is de vorige PNG nog steeds precies dezelfde. Die bewaren we in IndexedDB
   (te groot voor localStorage: een paar MB per kleurstelling) onder een
   sleutel die meeverandert zodra world.svg, data.json of het thema anders
   is, zodat een verouderde cache vanzelf niet meer treft. Het hoogteveld
   zelf blijft altijd opnieuw berekend — dat heeft ook bouwRivieren() nodig
   en is met tientallen MB's te groot om de moeite waard te cachen. */
/* Twee winkels: "png" voor het gekleurde reliëfbeeld, "rivieren" voor de
   berekende rivierlopen (paden + de punten waar riviernamen op vastklikken).
   Beide krijgen dezelfde soort sleutel (zie reliefSleutel in bouwGrond), dus
   wat hier gebeurt is gewoon een kleine sleutel/waarde-opslag per winkel. */
const reliefCache=(()=>{
  const NAAM="gj-reliefcache", WINKELS=["png","rivieren"];
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open(NAAM,1);
    r.onupgradeneeded=()=>{ for(const w of WINKELS)r.result.createObjectStore(w); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }));
  return{
    async get(winkel,sleutel){
      try{
        const db=await open();
        return await new Promise((res,rej)=>{
          const tx=db.transaction(winkel,"readonly").objectStore(winkel).get(sleutel);
          tx.onsuccess=()=>res(tx.result!==undefined?tx.result:null);
          tx.onerror=()=>rej(tx.error);
        });
      }catch(e){ return null; }
    },
    async set(winkel,sleutel,waarde){
      try{
        const db=await open();
        /* Licht en donker apart bewaren — wisselen van thema blijft dan aan
           beide kanten snel. De sleutel begint met "v1-dark-" of "v1-light-"
           (zie reliefSleutel), dus per kleurstelling ruimen we hier alles op
           wat niet de zojuist gezette sleutel is; anders groeit dit bij elke
           wijziging aan de kaart gewoon door. */
        const voorvoegsel=sleutel.replace(/^(v1-(?:dark|light)).*$/,"$1");
        await new Promise((res,rej)=>{
          const s=db.transaction(winkel,"readwrite").objectStore(winkel);
          const rq=s.getAllKeys();
          rq.onsuccess=()=>{
            for(const oud of rq.result)
              if(typeof oud==="string"&&oud.startsWith(voorvoegsel)&&oud!==sleutel)s.delete(oud);
            const tx=s.put(waarde,sleutel);
            tx.onsuccess=res; tx.onerror=()=>rej(tx.error);
          };
          rq.onerror=()=>rej(rq.error);
        });
      }catch(e){ /* vol, geblokkeerd of niet beschikbaar: dan maar geen cache */ }
    }
  };
})();
/* Snelle, niet-cryptografische hash (FNV-1a): hoeft alleen wijzigingen te
   herkennen, niet bestand tegen expres geknoei. */
function hashTekst(s){
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return (h>>>0).toString(36);
}

/* De opbouw van het reliëf gebeurt in stappen, met tussendoor een adempauze
   waarin de browser het scherm mag bijwerken. Zonder die pauzes is het één
   blok van seconden waarin niets te zien is — de laadbalk zou dan pas aan het
   eind in één klap vooruitspringen. `meld` geeft na elke stap door hoe ver we
   zijn; wie geen melding wil geeft niets mee. */
async function bouwGrond(meld){
  const pauze=meld?(deel,sleutel)=>meld(deel,sleutel):()=>{};
  const wortel=document.documentElement, stijl=getComputedStyle(wortel);
  const css=n=>stijl.getPropertyValue(n).trim();
  const donker=+css("--donker")>0;
  const kleurVan=t=>hexRGB(donker?t.donker:t.licht);
  const ROTS=hexRGB(css("--rots")), SNEEUW=hexRGB(css("--sneeuw")),
        GRENS=hexRGB(css("--coast"));
  const ids=Object.keys(GEO.vormen);

  /* Sleutel voor beide caches: verandert er iets aan de landvormen, het
     terrein of de kleurstelling, dan verandert de sleutel mee en treft een
     oudere cache-regel vanzelf niet meer. Beide caches vroeg checken, vóór
     al het rekenwerk hieronder: staan ze er allebei al, dan hoeft ook het
     hoogteveld — nodig voor zowel de kleuring als de rivieren — niet meer
     berekend te worden. */
  const reliefSleutel="v1-"+(donker?"dark":"light")+"-"+hashTekst(svgTekst)+"-"+hashTekst(JSON.stringify(DATA));
  const [gecached,gecachedRivieren]=await Promise.all([
    reliefCache.get("png",reliefSleutel),
    reliefCache.get("rivieren",reliefSleutel),
  ]);
  if(gecached&&gecachedRivieren){
    await pauze(.60,"laadLicht");
    gLand.textContent="";
    el("image",{class:"reliefbeeld",href:gecached,
      x:0,y:0,width:W,height:H,preserveAspectRatio:"none"},gLand);
    await pauze(.85,"laadRivieren");
    tekenRivieren(gecachedRivieren);
    zetRivierNamen();
    document.body.classList.add("relief");
    bouwRoutes();
    pas();
    return;
  }

  /* --- welk gebied ligt waar --- */
  RW=Math.round(W*RES); RH=Math.round(H*RES);
  const N=RW*RH;
  const cv=document.createElement("canvas"); cv.width=RW; cv.height=RH;
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.setTransform(RES,0,0,RES,0,0);
  ids.forEach((id,i)=>{
    ctx.fillStyle=`rgb(${i+1},0,0)`;
    for(const d of GEO.vormen[id])ctx.fill(new Path2D(d));
  });
  const beeld=ctx.getImageData(0,0,RW,RH), rd=beeld.data;
  const reg=new Uint8Array(N), land=new Uint8Array(N);
  let landpunten=0;
  for(let p=0,q=0;p<N;p++,q+=4){
    reg[p]=rd[q];
    if(rd[q+3]>120){land[p]=1;landpunten++;}
  }
  if(!landpunten)throw new Error("geen land gevonden");
  landvlak=land;

  /* --- terrein per punt, zacht over de landsgrenzen heen ---
     Dit gaat op een grover rooster: het zijn vloeiende velden, en na de
     vervaging is er van dat grovere rooster niets meer van te zien. */
  /* PS is het aantal punten per kaarteenheid van dit rooster. Het hoeft niet
     zo fijn te zijn als het reliëf zelf — het zijn vervaagde velden, en ze
     worden met een zachte overgang uitgelezen (zie tussen()). Eén punt per
     kaarteenheid is ruim genoeg en scheelt negen keer zoveel geheugen als het
     reliëfrooster. */
  const PS=1, PW=Math.round(W*PS), PH2=Math.round(H*PS);
  const pc=document.createElement("canvas"); pc.width=PW; pc.height=PH2;
  const pctx=pc.getContext("2d",{willReadFrequently:true});
  pctx.setTransform(PS,0,0,PS,0,0);
  ids.forEach((id,i)=>{
    pctx.fillStyle=`rgb(${i+1},0,0)`;
    for(const d of GEO.vormen[id])pctx.fill(new Path2D(d));
  });
  const pd=pctx.getImageData(0,0,PW,PH2).data;
  const M=PW*PH2;
  const fAmp=new Float32Array(M), fRug=new Float32Array(M), fKoud=new Float32Array(M);
  const fR=new Float32Array(M), fG=new Float32Array(M), fB=new Float32Array(M);
  const fKorrel=new Float32Array(M), fVlek=new Float32Array(M);
  /* Buiten het land een middenwaarde in plaats van niets: anders trekt de
     vervaging de kust naar zwart toe en krijgt elk strand een vuile rand. */
  const middel=kleurVan(GROEI.grasland);
  fAmp.fill(.4); fRug.fill(.3); fR.fill(middel[0]); fG.fill(middel[1]); fB.fill(middel[2]);
  fKorrel.fill(GROEI.grasland.korrel); fVlek.fill(GROEI.grasland.vlek);
  const info={};   /* per gebied: het terrein, opgezocht en klaargezet */
  ids.forEach((id,i)=>{
    const t=terreinVan(id);
    const meta=GEBIEDEN[id]||PLAATSEN.find(p=>p.vorm===id);
    const r=RELIEF[t.relief]||RELIEF.heuvels;
    const soorten=[].concat(t.begroeiing||"grasland").map(s=>GROEI[s]||GROEI.grasland);
    info[i+1]={t,r,soorten,kleuren:soorten.map(kleurVan),koud:t.koud?1:0,id,
      toon:hexRGB(css("--tone-"+((meta&&meta.tint)||"a")))};
  });
  /* Hoe ver een terrein over de landsgrens heen doorloopt. Een bergketen
     houdt niet op bij een grenspaal: de Oostelijke Steppen lopen bij Alpina en
     Skandia in de bergen over, en het reliëf hoort dat te laten zien. Dit is
     ruim genomen — een kleine straal gaf een vlakte die pal tegen een gebergte
     aan lag. Kleur en korrel houden een kortere straal aan: begroeiing volgt
     eerder het klimaat dan de hoogte, en die mag scherper wisselen. */
  const vrHoogte=Math.round(30*PS), vr=Math.round(22*PS);
  const fKust=new Float32Array(M), fFijn=new Float32Array(M);

  await pauze(.22,"laadKust");
  /* --- afstand tot de kust, het land in ---
     Dit moet de échte afstand zijn en geen schatting. De voor de hand liggende
     manier — twee vegen over het rooster waarbij elk punt bij zijn buurman één
     stap optelt, of 1,41 schuin — kost weinig maar meet scheef: recht en
     schuin worden verschillend afgerond, en het veld valt uiteen in diagonale
     facetten. Zolang je alleen naar de afstand kijkt zie je dat niet, maar het
     land loopt hier vanaf de kust omhoog en de schaduw meet de hélling; dan
     worden die facetten een streepjespatroon van hier tot ginder over het hele
     land. Wat hieronder staat is de exacte methode van Felzenszwalb: per
     kolom, en daarna per rij, de onderste omhullende van een rij parabolen.
     Even snel, en zonder voorkeursrichting.

     Het gaat over hetzelfde fijne rooster als het reliëf zelf. Op een grover
     rooster uitrekenen en er tussenin aflezen leek genoeg — het is tenslotte
     een traag veld — maar dat is het niet: tussen twee roosterpunten in een
     rechte lijn trekken laat de hélling op elke roosterlijn verspringen, en
     ook dát ziet de schaduw meteen. De afstand komt dus in hetzelfde vak
     terecht als waar straks de hoogte in gaat; elk punt heeft alleen zijn
     eigen waarde nodig, dus dat kan in één vak.                          */
  const h32=new Float32Array(N);
  {
    const VER=1e20, mx=Math.max(RW,RH);
    for(let p=0;p<N;p++)h32[p]=land[p]?VER:0;
    const f=new Float64Array(mx), dd=new Float64Array(mx);
    const v=new Int32Array(mx), z=new Float64Array(mx+1);
    const langs=n=>{
      let k=0; v[0]=0; z[0]=-VER; z[1]=VER;
      for(let q=1;q<n;q++){
        let s;
        for(;;){
          s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);
          if(s<=z[k])k--; else break;
        }
        k++; v[k]=q; z[k]=s; z[k+1]=VER;
      }
      k=0;
      for(let q=0;q<n;q++){
        while(z[k+1]<q)k++;
        dd[q]=(q-v[k])*(q-v[k])+f[v[k]];
      }
    };
    for(let x=0;x<RW;x++){
      for(let y=0;y<RH;y++)f[y]=h32[y*RW+x];
      langs(RH);
      for(let y=0;y<RH;y++)h32[y*RW+x]=dd[y];
    }
    for(let y=0;y<RH;y++){
      const o=y*RW;
      for(let x=0;x<RW;x++)f[x]=h32[o+x];
      langs(RW);
      for(let x=0;x<RW;x++)h32[o+x]=Math.sqrt(dd[x])/RES;
    }
  }

  /* Hoe breed het binnenland van elk gebied is: de grootste afstand tot de
     kust die er in voorkomt. Daar hangen twee dingen van af.

     De aanloop. Het land klimt vanaf de kust omhoog, en dat moet ergens klaar
     zijn. Een vaste aanloop van pakweg 26 eenheden werkt op de Oostelijke
     Steppen prima, maar Araluen is zesenvijftig eenheden breed: dan is het
     hele eiland aanloop en komt er nergens land van hoogte. Vandaar dat de
     aanloop meegroeit met het gebied waar hij in ligt.

     De fijnheid van de ruis. Op een werelddeel van duizend eenheden zijn
     bergketens van veertig eenheden precies goed; op Araluen passen er dan
     anderhalf en blijft er een vage veeg over. Kleine landen krijgen daarom
     fijnere ruis. Beide lopen via het vervaagde rooster, zodat er op een
     landsgrens geen sprong in het landschap ontstaat.                     */
  await pauze(.28,"laadGrenzen");
  /* --- de landsgrenzen ---
     Een punt ligt op de grens als een buurpunt bij een ander land hoort. Dat
     levert een streep van twee punten breed op, één aan elke kant, en precies
     één streep per grens: waar twee vormen uit world.svg elkaar overlappen is
     er per punt maar één land, dus valt er niets dubbel te tekenen. */
  const grensmerk=new Uint8Array(N);
  for(let y=1;y<RH-1;y++)for(let x=1;x<RW-1;x++){
    const p=y*RW+x;
    if(!land[p])continue;
    const r0=reg[p];
    if((land[p-1]&&reg[p-1]!==r0)||(land[p+1]&&reg[p+1]!==r0)||
       (land[p-RW]&&reg[p-RW]!==r0)||(land[p+RW]&&reg[p+RW]!==r0))grensmerk[p]=1;
  }

  const dmax=new Float32Array(256);
  for(let p=0;p<N;p++)if(land[p]&&h32[p]>dmax[reg[p]])dmax[reg[p]]=h32[p];
  const klem=(v,a,b)=>v<a?a:v>b?b:v;
  for(let p=0;p<M;p++){
    const d=dmax[pd[p*4]]||30;
    fKust[p]=klem(d*.55,5,26);
    fFijn[p]=klem(48/Math.max(8,d),.75,2.6);
  }
  veeg(fKust,PW,PH2,vr); veeg(fFijn,PW,PH2,vr);

  await pauze(.34,"laadBegroeiing");
  /* --- terrein per punt, zacht over de landsgrenzen heen ---
     Hoeveel het eigen kleurtje van een land van zijn begroeiing wint staat in
     TOON. Nul geeft een natuurkundig kloppende kaart waarop je geen land meer
     uit elkaar houdt; één geeft de egale vlakken van vroeger terug. Sinds de
     begroeiing zelf zichtbaar is als kleur en korrel mag dit lager staan dan
     eerst: de landen worden nu vooral uit elkaar gehouden door hun grenslijn,
     niet door hun tint. */
  const TOON=.30;
  /* Landschappen die in de boeken een naam hebben — het Grimsdell Woud, de
     Vlakte der Eenzamen, de Veenlanden — staan in data.json als plaats met een
     begroeiing en een straal. Die leggen hier een vlek van dat landschap om
     hun punt heen, over de begroeiing van het land heen. Zo staat het bos waar
     het in de boeken staat, in plaats van waar de ruis het toevallig legt. */
  const vlekken=[];
  for(const p of PLAATSEN){
    const b=GROEI[p.begroeiing]; const m=markerEls[p.id];
    if(!b||!m)continue;
    /* de vlek krijgt hetzelfde tintje van zijn land mee als de rest van dat
       land, anders springt een bos eruit als een andere kaart */
    const meta=GEBIEDEN[p.gebied];
    const o=hexRGB(css("--tone-"+((meta&&meta.tint)||"a"))), kl=kleurVan(b);
    vlekken.push({x:m.pos[0],y:m.pos[1],r:p.straal||14,rr:(p.straal||14)*1.75,b,
      k:[kl[0]+(o[0]-kl[0])*TOON, kl[1]+(o[1]-kl[1])*TOON, kl[2]+(o[2]-kl[2])*TOON]});
  }
  for(let y=0;y<PH2;y++)for(let x=0;x<PW;x++){
    const p=y*PW+x;
    if(pd[p*4+3]<=120)continue;
    const g=info[pd[p*4]]; if(!g)continue;
    const wx=x/PS, wy=y/PS;
    fAmp[p]=g.r.amp; fRug[p]=g.r.rug; fKoud[p]=g.koud;
    /* Meer dan één begroeiing in een gebied: welke van de twee het wordt hangt
       af van een trage ruis, met een zachte overgang ertussen. Zo krijgt
       Araluen akkerland met bossen ertussen in plaats van één egale kleur. De
       vlekken zijn even fijn als het reliëf, dus op een klein land zijn ze
       kleiner — anders valt een heel eiland onder één vlek.               */
    let k=g.kleuren[0], b0=g.soorten[0], b1=b0, mf=0;
    if(g.kleuren.length>1){
      const n=landruis(wx,wy,fFijn[p],.011,1,0)*(g.kleuren.length-1);
      const i0=Math.min(g.kleuren.length-2,Math.floor(n));
      mf=soep(Math.min(1,Math.max(0,(n-i0-.28)/.44)));
      const a=g.kleuren[i0], b=g.kleuren[i0+1];
      k=[a[0]+(b[0]-a[0])*mf, a[1]+(b[1]-a[1])*mf, a[2]+(b[2]-a[2])*mf];
      b0=g.soorten[i0]; b1=g.soorten[i0+1];
    }
    /* de korrel volgt dezelfde overgang als de kleur: waar het bosgroen wordt,
       wordt het oppervlak ook ruiger */
    fKorrel[p]=b0.korrel+(b1.korrel-b0.korrel)*mf;
    fVlek[p]=b0.vlek+(b1.vlek-b0.vlek)*mf;
    const o=g.toon;
    fR[p]=k[0]+(o[0]-k[0])*TOON; fG[p]=k[1]+(o[1]-k[1])*TOON; fB[p]=k[2]+(o[2]-k[2])*TOON;
  }
  veeg(fAmp,PW,PH2,vrHoogte); veeg(fRug,PW,PH2,vrHoogte); veeg(fKoud,PW,PH2,vrHoogte);
  veeg(fR,PW,PH2,vr); veeg(fG,PW,PH2,vr); veeg(fB,PW,PH2,vr);
  veeg(fKorrel,PW,PH2,vr); veeg(fVlek,PW,PH2,vr);

  /* De landschappen met een naam komen ná de vervaging, niet ervoor. Ze zijn
     ongeveer even groot als de vervaging breed is — het Doornbos meet negen
     eenheden, de vervaging dertien — dus ervoor gezet worden ze eenvoudigweg
     uitgesmeerd tot ze niet meer te zien zijn. Hun eigen rand is zacht en
     grillig, dus vervagen hoeven ze niet. */
  for(const v of vlekken){
    const x0=Math.max(0,Math.floor(v.x-v.rr)), x1=Math.min(PW-1,Math.ceil(v.x+v.rr));
    const y0=Math.max(0,Math.floor(v.y-v.rr)), y1=Math.min(PH2-1,Math.ceil(v.y+v.rr));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const p=y*PW+x;
      if(pd[p*4+3]<=120)continue;
      const dx=x/PS-v.x, dy=y/PS-v.y;
      /* de rand golft: een bos met een cirkel eromheen is geen bos maar een schijf */
      const golf=v.r*(.72+.56*ruis(x/PS*.10+91,y/PS*.10-53));
      const w=soep(Math.min(1,Math.max(0,1-Math.sqrt(dx*dx+dy*dy)/golf)));
      if(w<=0)continue;
      fR[p]+=(v.k[0]-fR[p])*w; fG[p]+=(v.k[1]-fG[p])*w; fB[p]+=(v.k[2]-fB[p])*w;
      fKorrel[p]+=(v.b.korrel-fKorrel[p])*w;
      fVlek[p]+=(v.b.vlek-fVlek[p])*w;
    }
  }

  const kust=new Uint8Array(N);
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
    const p=y*RW+x;
    if(!land[p]){h32[p]=0;continue;}
    const wx=x/RES, wy=y/RES;
    /* de vier omliggende punten van het terreinrooster, met hun gewichten */
    let ix=Math.floor(wx-.5), iy=Math.floor(wy-.5);
    if(ix<0)ix=0; else if(ix>PW-2)ix=PW-2;
    if(iy<0)iy=0; else if(iy>PH2-2)iy=PH2-2;
    let tx=wx-.5-ix, ty=wy-.5-iy;
    tx=tx<0?0:tx>1?1:tx; ty=ty<0?0:ty>1?1:ty;
    const ia=iy*PW+ix, ib=ia+1, ic=ia+PW, id=ic+1;
    const w0=(1-tx)*(1-ty), w1=tx*(1-ty), w2=(1-tx)*ty, w3=tx*ty;

    const k=soep(Math.min(1,h32[p]/tussen(fKust,ia,ib,ic,id,w0,w1,w2,w3)));
    kust[p]=k*255;
    const n=landruis(wx,wy,tussen(fFijn,ia,ib,ic,id,w0,w1,w2,w3),.026,6,
                     tussen(fRug,ia,ib,ic,id,w0,w1,w2,w3));
    const basis=k*tussen(fAmp,ia,ib,ic,id,w0,w1,w2,w3)*(.24+.76*n);
    /* de bergketen van Skandia naar Alpina trekt zijn eigen rug over de
       gebiedsgrenzen heen, los van de kust-aanloop van elk land apart. De
       overgang naar het gewone reliëf loopt breed en zacht uit (soep, niet
       lineair), zodat de rand niet als een harde witte vlek afsnijdt maar
       geleidelijk in het bestaande gebergte van bijvoorbeeld Alpina overloopt. */
    const dKeten=afstandTotKeten(wx,wy);
    const UITLOOP=70;
    const ketenRaw=Math.max(0,Math.min(1,1-dKeten/UITLOOP));
    const ketenT=ketenRaw*ketenRaw*ketenRaw*(10-15*ketenRaw+6*ketenRaw*ketenRaw);
    /* eigen, grovere ruis voor de keten: pieken en zadels langs de hele rug,
       los van de fijne begroeiingsruis, anders oogt de sneeuw als één vlak
       wit tapijt in plaats van als een reeks toppen met dalen ertussen */
    const kn=fbm(wx*.048,wy*.048,4,.55);
    const ketenHoogte=ketenT*(.42+.55*kn);
    /* lineair mengen, niet kwadratisch: een kwadraat drukt de overgangszone
       samen tot een paar rasterpunten, en dat geeft een te steile helling
       (een donkere slagschaduwband) waar de keten het gewone land raakt */
    h32[p]=Math.min(1,basis+(ketenHoogte-basis)*ketenT);
  }
  hoogte=h32;

  /* reliefSleutel en gecached (het PNG-plaatje) zijn al vroeg in de functie
     bepaald — hier komen we alleen terecht als dát een miss was (anders was
     de functie al klaar via de vroege return hierboven), maar de rivieren
     kunnen intussen nog steeds een aparte hit of miss zijn. */
  await pauze(.40,"laadLicht");
  let reliefUrl;
  if(gecached){
    reliefUrl=gecached;
  }else{
    /* --- licht, hoogtekleur en sneeuw ---
       Het licht komt uit het noordwesten: dat is op kaarten de gewoonte, en het
       is ook de enige richting waarbij een dal als een dal leest en niet als een
       rug. Wat de helling van de zon af staat wordt donker, wat er naartoe
       helt licht. */
    const LX=-.55, LY=-.55, LZ=.63;
    /* De helling wordt in kaarteenheden gemeten en niet in rasterpunten, zodat
       het reliëf er hetzelfde uitziet als je RES verandert. */
    const STEIL=16*RES/2;
    const strand=donker?[.86,.88,.82]:[1.10,1.08,.98];
    for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){
      const p=y*RW+x, q=p*4;
      if(!land[p]){rd[q+3]=0;continue;}
      const wx=x/RES, wy=y/RES;
      let ix=Math.floor(wx-.5), iy=Math.floor(wy-.5);
      if(ix<0)ix=0; else if(ix>PW-2)ix=PW-2;
      if(iy<0)iy=0; else if(iy>PH2-2)iy=PH2-2;
      let tx=wx-.5-ix, ty=wy-.5-iy;
      tx=tx<0?0:tx>1?1:tx; ty=ty<0?0:ty>1?1:ty;
      const ia=iy*PW+ix, ib=ia+1, ic=ia+PW, id=ic+1;
      const w0=(1-tx)*(1-ty), w1=tx*(1-ty), w2=(1-tx)*ty, w3=tx*ty;

      const hh=h32[p];
      let r=tussen(fR,ia,ib,ic,id,w0,w1,w2,w3),
          g=tussen(fG,ia,ib,ic,id,w0,w1,w2,w3),
          b=tussen(fB,ia,ib,ic,id,w0,w1,w2,w3);
      /* hoe hoger, hoe meer rots; en op de toppen van de koude landen sneeuw */
      if(hh>.40){
        const t=Math.min(1,(hh-.40)/.42);
        r+=(ROTS[0]-r)*t; g+=(ROTS[1]-g)*t; b+=(ROTS[2]-b)*t;
      }
      const ketenKoud=soep(Math.max(0,Math.min(1,1-afstandTotKeten(wx,wy)/30)));
      const koudheid=Math.max(tussen(fKoud,ia,ib,ic,id,w0,w1,w2,w3),ketenKoud);
      const grens=.90-.48*koudheid;
      if(hh>grens){
        const t=Math.min(1,(hh-grens)/.32);
        r+=(SNEEUW[0]-r)*t; g+=(SNEEUW[1]-g)*t; b+=(SNEEUW[2]-b)*t;
      }
      /* de helling, uit het hoogteverschil met de buren */
      const gx=((x>0?h32[p-1]:hh)-(x<RW-1?h32[p+1]:hh))*STEIL;
      const gy=((y>0?h32[p-RW]:hh)-(y<RH-1?h32[p+RW]:hh))*STEIL;
      const len=Math.sqrt(gx*gx+gy*gy+1);
      const sh=Math.max(0,(gx*LX+gy*LY+LZ)/len);
      let m=.55+.71*sh;
      /* --- de begroeiing zelf ---
         Hier stonden eerst getekende boompjes en bergjes op de kaart. Die zijn
         eruit: van bovenaf zie je geen boom maar een dek van kruinen, en dat is
         een korrel, geen tekentje. Twee schalen bij elkaar doen het werk.

         De korrel, op ongeveer drie eenheden en fijner: de kruinen zelf, met de
         schaduw ertussen. Hoe grover de begroeiing, hoe sterker — een naaldwoud
         is ruig, een akker glad. Dit is wat een vlak groen tot bos maakt.

         De vlek, op een eenheid of twaalf: open plekken in een woud, droge
         stukken op de steppe, een streek die net wat anders kleurt. Zonder die
         tweede schaal blijft het een egale vacht.

         Gestapelde ruis, geen enkele laag: één laag waardenruis is per definitie
         een rooster van vlekken, en dat rooster is met het blote oog te zien. */
      m*=1+(fbm(wx*.17,wy*.17,2,0)-.5)*tussen(fKorrel,ia,ib,ic,id,w0,w1,w2,w3)
          +(ruis(wx*.085+311,wy*.085-127)-.5)*tussen(fVlek,ia,ib,ic,id,w0,w1,w2,w3);
      /* de laatste meters voor de kust lopen naar het strand toe op */
      if(kust[p]<41){
        const t=1-kust[p]/41;
        r+=(r*strand[0]-r)*t; g+=(g*strand[1]-g)*t; b+=(b*strand[2]-b)*t;
      }
      /* De landsgrens komt na het licht, niet ervoor: een grens die meegaat met
         de schaduw verdwijnt op de donkere flank van een bergrug en licht op de
         zonkant juist op. Hij moet overal even zwaar zijn. */
      if(grensmerk[p]){
        r=r*m+(GRENS[0]-r*m)*.5; g=g*m+(GRENS[1]-g*m)*.5; b=b*m+(GRENS[2]-b*m)*.5;
        m=1;
      }
      /* Een bitmap heeft maar 256 stappen per kleur. Op een flauwe helling loopt
         de schaduw zo langzaam op dat elke stap over een strook van een paar
         punten breed wordt uitgesmeerd, en dan liggen er ineens terrassen over
         het land — precies het soort streepjespatroon dat een kaart er digitaal
         uit laat zien. Een half stapje ruis bij het afronden breekt die grens:
         de punten vlak bij de overgang vallen dan de ene keer omhoog en de
         andere keer omlaag, en het oog ziet weer een verloop. */
      const dith=hash2(x,y)-.5;
      rd[q]=Math.max(0,Math.min(255,r*m+dith));
      rd[q+1]=Math.max(0,Math.min(255,g*m+dith));
      rd[q+2]=Math.max(0,Math.min(255,b*m+dith));
      rd[q+3]=rd[q+3]>250?255:rd[q+3];   /* de rafelrand van de kust blijft zacht */
    }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.putImageData(beeld,0,0);
    reliefUrl=cv.toDataURL("image/png");
    reliefCache.set("png",reliefSleutel,reliefUrl);   /* niet afgewacht: mag op de achtergrond */
  }
  gLand.textContent="";
  el("image",{class:"reliefbeeld",href:reliefUrl,
    x:0,y:0,width:W,height:H,preserveAspectRatio:"none"},gLand);

  await pauze(.74,"laadRivieren");
  if(gecachedRivieren){
    tekenRivieren(gecachedRivieren);
  }else{
    reliefCache.set("rivieren",reliefSleutel,bouwRivieren(info,reg));
  }
  zetRivierNamen();
  document.body.classList.add("relief");
  bouwRoutes();               /* een verschoven riviernaam kan in een route zitten */
  pas();
}

/* ---- rivieren ----
   Bergaf lopen vanaf een hoog punt lijkt de voor de hand liggende manier, maar
   dat werkt niet: op een vlakte is er geen laagste buur, en dan trekt zo'n
   loop een kaarsrechte streep dwars over de Oostelijke Steppen. Rivieren komen
   hier daarom uit de afwatering van het hele land, in drie stappen.

     kommen vullen   Het hoogteveld zit vol kuiltjes waar water in blijft
                     staan. Die worden opgevuld tot de rand, zodat er van elk
                     punt op het land een weg naar zee bestaat. Dat gebeurt van
                     de zee uit naar binnen toe, telkens vanaf het laagste punt
                     dat nog aan de beurt is.
     afvoer          Elk punt wijst naar zijn laagste buur. Zo ontstaat er een
                     boom die overal in zee eindigt.
     water tellen    Van hoog naar laag telt elk punt zijn water bij dat van
                     zijn buurman op. Wat er dan doorheen komt is precies het
                     stroomgebied, en waar dat groot genoeg wordt is het een
                     rivier — met zijtakken die vanzelf op de juiste plek
                     samenkomen, en een bedding die naar de monding toe breder
                     wordt.

   Het gebeurt op een grover rooster dan het reliëf: twee eenheden per punt is
   ruim genoeg voor rivieren en scheelt een factor zesendertig aan rekenwerk.
   Wat er in data.json onder terrein staat telt mee — een woestijn watert
   nauwelijks af, en rivieren:0 bij een gebied houdt het er helemaal droog. */
let rivierpunten=[];
/* Zet de paden en riviernaam-punten van bouwRivieren() op het scherm — hetzij
   net berekend, hetzij rechtstreeks uit de cache. Los van bouwRivieren zelf,
   zodat een cache-hit dit tekenwerk kan doen zonder ook het rekenwerk te
   herhalen. */
function tekenRivieren(data){
  gWater.textContent="";
  for(const p of data.paden)el("path",{class:p.klasse,d:p.d},gWater);
  rivierpunten=data.punten;
}
function bouwRivieren(info,reg){
  const paden=[];
  rivierpunten=[];
  const GS=2, GW=Math.round(W/GS), GH=Math.round(H/GS), G=GW*GH;
  const h=new Float32Array(G), zee=new Uint8Array(G), vak=new Uint8Array(G);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const x=Math.min(RW-1,Math.round((i+.5)*GS*RES));
    const y=Math.min(RH-1,Math.round((j+.5)*GS*RES));
    const p=y*RW+x, c=j*GW+i;
    if(landvlak[p]){h[c]=hoogte[p]; vak[c]=reg[p];} else zee[c]=1;
  }

  /* --- kommen vullen ---
     Een hoop op volgorde: telkens komt het laagste punt dat al aan zee hangt
     naar boven, en zijn buren worden opgetild tot minstens die hoogte. Wat
     eenmaal behandeld is ligt vast, dus elk punt komt één keer langs. */
  const hoopH=new Float64Array(G+1), hoopI=new Int32Array(G+1); let hn=0;
  function erin(c){
    let k=++hn; hoopH[k]=h[c]; hoopI[k]=c;
    while(k>1){
      const o=k>>1; if(hoopH[o]<=hoopH[k])break;
      const e=hoopH[o],i=hoopI[o]; hoopH[o]=hoopH[k];hoopI[o]=hoopI[k];hoopH[k]=e;hoopI[k]=i;
      k=o;
    }
  }
  function eruit(){
    const uit=hoopI[1];
    hoopH[1]=hoopH[hn]; hoopI[1]=hoopI[hn]; hn--;
    let k=1;
    for(;;){
      const l=k<<1, r=l+1; let m=k;
      if(l<=hn&&hoopH[l]<hoopH[m])m=l;
      if(r<=hn&&hoopH[r]<hoopH[m])m=r;
      if(m===k)break;
      const e=hoopH[m],i=hoopI[m]; hoopH[m]=hoopH[k];hoopI[m]=hoopI[k];hoopH[k]=e;hoopI[k]=i;
      k=m;
    }
    return uit;
  }
  const gezien=new Uint8Array(G);
  for(let c=0;c<G;c++){
    const i=c%GW, j=(c/GW)|0;
    if(zee[c]||!i||!j||i===GW-1||j===GH-1){gezien[c]=1;erin(c);}
  }
  const stap=[-1,1,-GW,GW,-GW-1,-GW+1,GW-1,GW+1];
  /* Een haartje verval in een opgevuld kuiltje, anders staat het water stil.
     Dat haartje krijgt een willekeurige maat mee: met overal precies hetzelfde
     verval loopt een opgevulde vlakte kaarsrecht af, en dan trekt de rivier
     daar een liniaalrechte streep doorheen. Met een grillig haartje kronkelt
     hij, zoals een rivier op een vlakte hoort te doen. */
  const HAAR=1e-5;
  while(hn){
    const c=eruit(), i=c%GW;
    for(const d of stap){
      const n=c+d;
      if(n<0||n>=G||gezien[n])continue;
      if(Math.abs(n%GW-i)>1)continue;      /* niet over de rand heen wikkelen */
      gezien[n]=1;
      if(h[n]<=h[c])h[n]=h[c]+HAAR*(.2+1.8*hash2(n,c));
      erin(n);
    }
  }

  /* --- waar elk punt heen afwatert, en hoeveel er langskomt --- */
  const naar=new Int32Array(G).fill(-1), orde=[];
  for(let c=0;c<G;c++){
    if(zee[c])continue;
    orde.push(c);
    const i=c%GW; let laag=h[c], best=-1;
    for(const d of stap){
      const n=c+d;
      if(n<0||n>=G||Math.abs(n%GW-i)>1)continue;
      if(h[n]<laag){laag=h[n];best=n;}
    }
    naar[c]=best;
  }
  orde.sort((a,b)=>h[b]-h[a]);   /* van hoog naar laag: stroomopwaarts eerst */
  const water=new Float32Array(G);
  for(const c of orde)water[c]=1;
  for(const c of orde){const r=naar[c]; if(r>=0)water[r]+=water[c];}

  /* --- welk gebied hoeveel afwatering nodig heeft voor een rivier ---
     Twee dingen tellen mee. Het klimaat: een woestijn watert nauwelijks af, en
     rivieren:0 bij een gebied houdt het er helemaal droog. En de maat van het
     land: een drempel die op de Oostelijke Steppen de grote stromen overhoudt,
     is voor Araluen — zesenvijftig eenheden breed — hoger dan het hele eiland
     ooit bij elkaar kan brengen, en dan blijft daar geen druppel over. De
     drempel schaalt daarom mee met hoeveel land er te vergeven is. */
  const opp={};
  for(let c=0;c<G;c++)if(!zee[c])opp[vak[c]]=(opp[vak[c]]||0)+1;
  const dorst={};
  for(const k in info){
    const t=info[k].t, soorten=[].concat(t.begroeiing||"");
    let m=1;
    if(soorten.indexOf("woestijn")>=0)m=8;
    else if(soorten.indexOf("steppe")>=0)m=3;
    if(t.rivieren===0)m=Infinity;
    else if(t.rivieren>0)m=1/t.rivieren;
    const a=opp[k]||1;
    dorst[k]=m*Math.min(1,Math.max(.10,a/2600));
  }
  /* Vanaf hoeveel afwatering het een rivier heet. Lager geeft een fijner net
     van beken en maakt de kaart druk; hoger houdt alleen de grote stromen
     over. Dit is per gebied nog eens vermenigvuldigd met dorst hierboven. */
  const T=165;
  const water_genoeg=c=>!zee[c]&&water[c]>=T*(dorst[vak[c]]||1);

  /* --- de lopen uittekenen ---
     Begonnen wordt bij een bovenloop: een punt dat net rivier is en waar geen
     rivier in uitkomt. Van daar volgt de loop de afvoer tot in zee of tot hij
     op een al getekende loop stuit — daar is het een zijtak die uitmondt. */
  const getekend=new Uint8Array(G);
  const bronnen=[];
  for(let c=0;c<G;c++){
    if(!water_genoeg(c))continue;
    const i=c%GW; let boven=false;
    for(const d of stap){
      const n=c+d;
      if(n<0||n>=G||Math.abs(n%GW-i)>1)continue;
      if(naar[n]===c&&water_genoeg(n)){boven=true;break;}
    }
    if(!boven)bronnen.push(c);
  }
  bronnen.sort((a,b)=>water[b]-water[a]);   /* de grootste stroom eerst */

  /* Een loop over acht richtingen zigzagt in stapjes van vijfenveertig graden.
     Twee keer uitmiddelen haalt die hoek eraf; de kromme door de punten doet
     de rest. */
  function strijk(p){
    for(let ronde=0;ronde<2;ronde++){
      const uit=p.slice();
      for(let i=1;i<p.length-1;i++)
        uit[i]=[(p[i-1][0]+p[i][0]*2+p[i+1][0])/4,(p[i-1][1]+p[i][1]*2+p[i+1][1])/4];
      p=uit;
    }
    return p;
  }
  const klasse=w=>w>=T*11?"r3":w>=T*3.4?"r2":"r1";
  for(const start of bronnen){
    const punten=[], stromen=[];
    let c=start;
    for(let n=0;n<6000;n++){
      punten.push([((c%GW)+.5)*GS,(((c/GW)|0)+.5)*GS]);
      stromen.push(water[c]);
      if(zee[c])break;
      const al=getekend[c]; getekend[c]=1;
      if(al&&punten.length>1)break;
      const r=naar[c]; if(r<0)break;
      c=r;
    }
    if(punten.length<5)continue;
    const glad=strijk(punten);
    /* de lopen worden bewaard, zodat de rivieren die in de boeken een naam
       hebben straks op het water komen te liggen in plaats van ernaast */
    for(const q of glad)rivierpunten.push(q);
    /* Het pad in stukken knippen op hoeveel water er langskomt: bovenin een
       haarlijn, bij de monding een echte stroom. De stukken overlappen één
       punt, anders valt er een gaatje op de overgang. */
    let i0=0;
    for(let i=1;i<=glad.length;i++){
      const nu=klasse(stromen[Math.min(i,glad.length-1)]);
      if(i===glad.length||nu!==klasse(stromen[i0])){
        const deel=glad.slice(i0,Math.min(glad.length,i+1));
        if(deel.length>1)paden.push({klasse:"rivier "+klasse(stromen[i0]),d:vloeiend(deel)});
        i0=i;
      }
    }
  }
  const data={paden,punten:rivierpunten};
  tekenRivieren(data);
  return data;
}

/* ---- de rivieren die een naam hebben ----
   In de boeken heten een paar rivieren bij naam: de Slijpsteenrivier, de
   Zalmrivier, de Tarbusrivier. Die staan in data.json als plaats met een punt,
   en dat punt is een schatting — het lag naast het water in plaats van erop.
   Hier wordt zo'n naam naar de dichtstbijzijnde echte loop geschoven, zodat de
   naam bij een rivier staat en niet ergens in een weiland.

   Het is dezelfde soort correctie als opLand() hierboven, die een stad die in
   zee belandde het land op schuift. En net als daar telt geenSnap: heb jij de
   markering in de bewerkstand zelf neergezet, dan blijft hij staan waar jij
   hem hebt gelegd.                                                        */
function zetRivierNamen(){
  if(!rivierpunten.length)return;
  const BEREIK=30;
  for(const p of PLAATSEN){
    if(p.soort!=="rivier"||p.geenSnap)continue;
    const m=markerEls[p.id]; if(!m)continue;
    let best=null, bd=BEREIK*BEREIK;
    for(const q of rivierpunten){
      const dx=q[0]-m.pos[0], dy=q[1]-m.pos[1], d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=q;}
    }
    if(!best)continue;
    m.pos=[+best[0].toFixed(2),+best[1].toFixed(2)];
    plekCache[p.id]=m.pos;
    m.g.setAttribute("transform",`translate(${m.pos[0]},${m.pos[1]})`);
  }
}

/* ======================= zoomen en schuiven ======================= */
let view={x:0,y:0,k:1}; const minK=.85, maxK=26;
function begrens(){
  view.k=Math.max(minK,Math.min(maxK,view.k));
  view.x=Math.min(W/2+.15*view.k*W,Math.max(W/2-1.15*view.k*W,view.x));
  view.y=Math.min(H/2+.15*view.k*H,Math.max(H/2-1.15*view.k*H,view.y));
}
function naarUser(cx,cy){
  const m=svg.getScreenCTM().inverse(), p=new DOMPoint(cx,cy).matrixTransform(m);
  return {x:p.x,y:p.y};
}
/* Op het overzicht is dit een kaart van landen, geen kaart van plaatsen: een
   eiland ter grootte van een duim met dertig kasteeltjes erop leest niet. Ver
   uitgezoomd verdwijnen de markeringen daarom en blijven alleen de land- en
   zeenamen staan; één zoomstap (1,5×) verder zijn ze er weer. Wat je zelf hebt
   aangewezen blijft wel staan — de gekozen plaats, de plaatsen van een gekozen
   reisroute, en alles in de bewerkstand — anders kijk je naar een lege kaart
   of naar een routelijn zonder begin en eind. */
const STIL_TOT=1.35;              /* maal het overzicht: daaronder geen markeringen */
let routePlekken=new Set();       /* de plaatsen van de gekozen reisroute */
const stilNu=()=>view.k<kBasis*STIL_TOT&&!zetten;

function pas(){
  world.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`);
  const s=1/view.k;
  for(const it of zeeLabels)it.t.setAttribute("transform",`scale(${s*(it.d.maat||1)})`);
  const stil=stilNu();
  for(const p of PLAATSEN){
    const m=markerEls[p.id]; if(!m)continue;
    m.inner.setAttribute("transform",`scale(${s})`);
    /* namen verschijnen ten opzichte van het overzicht, niet op een vaste
       zoomwaarde: zo blijft het kloppen als er land bij komt en het
       overzicht verder uitzoomt */
    m.g.classList.toggle("showlabel",view.k>=kBasis*(p.z||3)/2.4);
    m.g.classList.toggle("stil",stil&&p.id!==state.sel&&!routePlekken.has(p.id));
  }
  ontwarGebieden();
  ontwar();
}

/* Namen die over elkaar heen vallen zijn onleesbaar. De belangrijkste plaatsen
   krijgen voorrang; wie daarna nog botst, laat zijn naam weg tot je verder
   inzoomt en er ruimte is. De markering zelf blijft altijd staan. */
/* Een landnaam die breder is dan zijn eigen land loopt over de buren heen.
   Zolang hij niet past blijft hij weg; zoom je in, dan wordt de beschikbare
   ruimte in beeld groter en verschijnt hij alsnog. */
const MIN_LAND_PX=5;   /* daaronder is een landnaam een veeg; dan liever niets */
function ontwarGebieden(){
  for(const gl of gebiedLabels){
    if(!gl.breedte){
      try{gl.breedte=gl.t.getComputedTextLength();}catch(e){gl.breedte=40;}
    }
    /* Twee wensen: de naam houdt bij voorkeur een vaste maat op het scherm,
       en hij moet binnen zijn eigen land blijven. De kleinste van de twee
       wint. Bij uitzoomen krimpt de naam dus mee met het land in plaats van
       te verdwijnen — alleen als hij echt onleesbaar klein zou worden gaat
       hij weg. Zoom je in op een klein land, dan groeit zijn naam door tot
       dezelfde maat als die van de grote landen: klein op de kaart betekent
       niet dat je de naam niet hoeft te kunnen lezen. */
    const wens=1/view.k;
    const past=gl.breed*.95/gl.breedte;
    /* maat is jouw eigen keuze en gaat boven het inpassen heen: zet je een
       landnaam groter, dan wordt hij groter, ook als hij daarmee zijn kust
       een eind over gaat. */
    const s=gl.s=(gl.d.maat||1)*Math.min(wens,past);
    gl.t.setAttribute("transform",`scale(${s})`);
    gl.t.style.display = s*13*view.k < MIN_LAND_PX ? "none" : "";
  }
}

const breedteCache={};
function ontwar(){
  /* de landnamen zijn er eerst: hun vak wordt gereserveerd, zodat geen enkele
     plaatsnaam er dwars overheen komt te staan */
  const genomen=[];
  for(const gl of gebiedLabels){
    if(gl.t.style.display==="none"||!gl.breedte)continue;
    const s=gl.s;   /* dezelfde maat als getekend; ontwarGebieden() ging voor */
    const w=gl.breedte*s+4/view.k, h=13*s+3/view.k;
    genomen.push({x:gl.x-w/2, y:gl.y-h*.78, w, h});
  }
  const raakt=(a)=>genomen.some(r=>a.x<r.x+r.w&&a.x+a.w>r.x&&a.y<r.y+r.h&&a.y+a.h>r.y);
  const kandidaten=PLAATSEN.filter(p=>markerEls[p.id])
    .sort((a,b)=>(a.z||3)-(b.z||3)||a.naam.length-b.naam.length);

  /* Eerst de tekentjes zelf. Bij ver uitzoomen krimpt het land wel maar de
     markeringen niet, en dan wordt Araluen één zwarte klont. Wie niet meer
     past valt weg tot je verder inzoomt; de belangrijkste plaatsen zijn het
     eerst aan de beurt en blijven dus staan. */
  const glyf=11/view.k;
  for(const p of kandidaten){
    const m=markerEls[p.id];
    /* wat je niet ziet hoeft ook geen plek op te eisen: anders duwt een
       weggevaagde markering op het overzicht nog altijd een routeplaats weg */
    if(m.g.classList.contains("hidden")||m.g.classList.contains("stil")){m.g.classList.remove("weg");continue;}
    if(zetten||m.g.classList.contains("sel")){
      m.g.classList.remove("weg");
      genomen.push({x:m.pos[0]-glyf/2,y:m.pos[1]-glyf/2,w:glyf,h:glyf});
      continue;
    }
    const vak={x:m.pos[0]-glyf/2,y:m.pos[1]-glyf/2,w:glyf,h:glyf};
    if(raakt(vak))m.g.classList.add("weg");
    else {m.g.classList.remove("weg");genomen.push(vak);}
  }

  /* daarna de namen, in dezelfde volgorde */
  for(const p of kandidaten){
    const m=markerEls[p.id];
    if(!m.g.classList.contains("showlabel")||m.g.classList.contains("hidden")
      ||m.g.classList.contains("weg"))continue;
    if(breedteCache[p.id]===undefined){
      try{breedteCache[p.id]=m.t.getComputedTextLength();}catch(e){breedteCache[p.id]=p.naam.length*5;}
    }
    /* het vak volgt het bordje: eigen maat, en verschoven zoals jij het hebt
       neergelegd. Een gedraaid bordje wordt hier als rechtop gerekend; dat is
       ruim genoeg om namen uit elkaar te houden. */
    const mt=p.maat||1;
    const w=(breedteCache[p.id]*mt+4)/view.k, h=13*mt/view.k;
    const vak={x:m.pos[0]+(p.lx||0)/view.k-w/2, y:m.pos[1]+((p.ly||0)-10)/view.k-h, w, h};
    if(raakt(vak)&&!m.g.classList.contains("sel"))m.g.classList.remove("showlabel");
    else genomen.push(vak);
  }
}
let anim=null;
function zetView(x,y,k,animeer){
  if(anim)cancelAnimationFrame(anim),anim=null;
  const van={...view}, naar={x,y,k};
  if(!animeer||matchMedia("(prefers-reduced-motion:reduce)").matches){
    view=naar; begrens(); pas(); return;
  }
  const t0=performance.now(), duur=560;
  (function stap(nu){
    const t=Math.min(1,(nu-t0)/duur), e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    view={x:van.x+(naar.x-van.x)*e,y:van.y+(naar.y-van.y)*e,k:van.k+(naar.k-van.k)*e};
    begrens(); pas();
    anim = t<1 ? requestAnimationFrame(stap) : null;
  })(t0);
}
/* Het kader van world.svg is veel groter dan het getekende land, dus "alles
   tonen" past op de landvormen zelf. Komt er land bij, dan schuift dat mee. */
const inhoud=gVlak.getBBox();
let kBasis=1;
const heel=a=>vliegVak(inhoud,1.1,maxK,a);
function paneelSchuif(){
  if(innerWidth<=900||!detail.classList.contains("open"))return 0;
  const r=svg.getBoundingClientRect();
  const perEenheid=Math.min(r.width/W,r.height/H);
  return perEenheid?detail.getBoundingClientRect().width/2/perEenheid:0;
}
const vliegNaar=(mx,my,k=8,a=true)=>zetView(W/2-mx*k-paneelSchuif(),H/2-my*k,k,a);
function vliegVak(b,marge=1.5,maxk=14,animeer=true){
  const k=Math.max(minK,Math.min(maxk,Math.min(W/(b.width*marge),H/(b.height*marge))));
  zetView(W/2-(b.x+b.width/2)*k-paneelSchuif(),H/2-(b.y+b.height/2)*k,k,animeer);
}
function zoomOp(ux,uy,factor){
  const k=Math.max(minK,Math.min(maxK,view.k*factor));
  view.x=ux-(ux-view.x)*(k/view.k);
  view.y=uy-(uy-view.y)*(k/view.k);
  view.k=k; begrens(); pas();
}
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const p=naarUser(e.clientX,e.clientY);
  zoomOp(p.x,p.y,Math.exp(-e.deltaY*(e.deltaMode===1?.03:.0016)));
},{passive:false});
/* Hoe ver de muis onderweg is gekomen, in schermpunten. Dat moet in
   schermpunten en niet in kaarteenheden: ingezoomd is een flinke sleep maar
   een halve eenheid ver, en dan zou hij als een klik tellen — precies de
   reden dat een sleep over het land dat land selecteerde. */
const ptrs=new Map(); let laatste=null, knijp=0, bewogen=0, vorigePt=null;
/* Na een sleep hoort het loslaten niets aan te wijzen. Elke klik op de kaart
   vraagt dit eerst; het klik-event komt na pointerup, dus de telling van de
   sleep die er net was staat er dan nog. */
function gesleept(){ return bewogen>5; }
const knijpAfstand=()=>{const[a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y);};
const knijpMidden=()=>{const[a,b]=[...ptrs.values()];return naarUser((a.x+b.x)/2,(a.y+b.y)/2);};
/* Geen setPointerCapture op de kaart: dat stuurt het daaropvolgende click-event
   naar de svg zelf in plaats van naar het land of de markering waarop je drukt,
   waardoor het zijpaneel niet opengaat. Slepen luistert daarom op het venster. */
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    laatste=naarUser(e.clientX,e.clientY);
    bewogen=0; vorigePt={x:e.clientX,y:e.clientY};
    svg.classList.add("drag");
  }
  if(ptrs.size===2)knijp=knijpAfstand();
});
addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const d=knijpAfstand(); if(knijp>0){const m=knijpMidden();zoomOp(m.x,m.y,d/knijp);} knijp=d; return;
  }
  if(!laatste)return;
  if(vorigePt){
    bewogen+=Math.abs(e.clientX-vorigePt.x)+Math.abs(e.clientY-vorigePt.y);
    vorigePt={x:e.clientX,y:e.clientY};
  }
  const p=naarUser(e.clientX,e.clientY);
  view.x+=p.x-laatste.x; view.y+=p.y-laatste.y; begrens(); pas();
  laatste=naarUser(e.clientX,e.clientY);
},{passive:true});
function eindePtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)knijp=0;
  if(ptrs.size===0){laatste=null;svg.classList.remove("drag");}
}
addEventListener("pointerup",eindePtr); addEventListener("pointercancel",eindePtr);
svg.addEventListener("click",()=>{if(!gesleept())kies(null);});

/* ========================== bewerken ==========================
   Jij ziet de kaart, ik zie alleen een afbeelding. In de bewerkstand pak je
   alles wat erop staat beet: een markering sleep je naar de goede plek, en
   een naam — van een plaats, een zee of een land — sleep je, draai je en
   maak je groter of kleiner. Alles verandert DATA zelf en komt er als een
   volledige data.json weer uit, die je in de map opslaat.               */
const zetbalk=$("#zetbalk"), zetstand=$("#zetstand"), zetsel=$("#zetsel");
let zetten=false, sleep=null, keuze=null;

/* ---- de stand bewaren en wegschrijven ---- */
/* bouwRoutes() hangt berekende paden aan de routes; die zijn rekenwerk en
   horen niet in het bestand. Verder gaat er niets in wat toch al de
   standaard is: een verschuiving van nul en een maat van één zijn precies
   wat er staat als je het weglaat. Voor de rest is DATA de inhoud. */
function schoon(o){
  const s={};
  for(const k in o){
    if(k==="paden"||k==="kanNiet")continue;
    if((k==="lx"||k==="ly"||k==="rot")&&!o[k])continue;
    if(k==="maat"&&o[k]===1)continue;
    s[k]=o[k];
  }
  return s;
}
/* Velden die in data.json altijd als {nl,en} voorkomen. Bij een gloednieuw
   item (net aangemaakt in de bewerkstand) bestaat er nog geen RUWDATA-kant
   om tegen te sychroniseren, dus moet terugvertaal() op de sleutelnaam
   afgaan om te weten dat zo'n veld een taalobject hoort te worden. */
const TAALVELDEN=new Set(["naam","tekst","label","bijschrift"]);
/* Verwerkt wat er in de bewerkstand aan de vertaalde DATA is veranderd
   (posities, been-coördinaten, een nieuwe plaats, ...) terug in RUWDATA,
   waar naam/tekst nog tweetalig staan. Zo blijft de niet-actieve taal
   intact ook al bewerk je de kaart in maar één taal tegelijk. ruw is een
   losse waarde uit RUWDATA, v de overeenkomende waarde uit de live DATA. */
function terugvertaal(ruw,v,taalveld){
  if(isTaalObject(ruw)){
    ruw[TAAL]=v;
    return ruw;
  }
  if(typeof v==="string"&&taalveld){
    /* nieuw veld zonder RUWDATA-tegenhanger: allebei de talen op deze
       waarde zetten totdat iemand de andere taal apart intypt */
    return {nl:v,en:v};
  }
  if(Array.isArray(v)){
    return v.map((item,i)=>terugvertaal(
      Array.isArray(ruw)&&ruw[i]!==undefined?ruw[i]:undefined,item));
  }
  if(v&&typeof v==="object"){
    const out=(ruw&&typeof ruw==="object"&&!Array.isArray(ruw))?ruw:{};
    for(const k in v)out[k]=terugvertaal(out[k],v[k],TAALVELDEN.has(k));
    /* een sleutel die in de vertaalde kant is verdwenen (bv. delete d.rot)
       hoort ook in RUWDATA te verdwijnen */
    for(const k in out)if(!(k in v))delete out[k];
    return out;
  }
  return v;
}
function schoneData(){
  terugvertaal(RUWDATA,DATA);
  const bron=RUWDATA;
  const uit={};
  for(const k of ["_uitleg","boeken","gebieden","zeeen","detail","plaatsen","routegroepen","routes"])
    if(bron[k]!==undefined)uit[k]=bron[k];
  uit.gebieden=Object.fromEntries(Object.entries(uit.gebieden).map(([k,v])=>[k,schoon(v)]));
  uit.zeeen=uit.zeeen.map(schoon);
  uit.plaatsen=uit.plaatsen.map(schoon);
  uit.routes=uit.routes.map(schoon);
  return uit;
}
/* Dezelfde opmaak als data.json in de map: alles op een eigen regel, maar wat
   op één regel past blijft op één regel. Anders is het bestand daarna niet
   meer met de hand te bewerken. */
const BREED=108;
const plat=v=>JSON.stringify(v).replace(/","/g,'", "').replace(/\],\[/g,"], [");
function netjes(v,diep){
  const sp=" ".repeat(diep);
  if(v===null||typeof v!=="object")return JSON.stringify(v);
  const kort=plat(v);
  if(diep+kort.length<=BREED)return kort;
  if(Array.isArray(v))
    return "[\n"+v.map(x=>sp+" "+netjes(x,diep+1)).join(",\n")+"\n"+sp+"]";
  return "{\n"+Object.entries(v)
    .map(([k,x])=>sp+" "+JSON.stringify(k)+": "+netjes(x,diep+1)).join(",\n")+"\n"+sp+"}";
}
const dataTekst=()=>netjes(schoneData(),0)+"\n";

function toonZetstand(){
  zetstand.textContent = bewerkt
    ? `${bewerkt} ${bewerkt===1?t("veranderingEnkel"):t("veranderingMeervoud")} ${t("nogNietOpgeslagen")}`
    : t("sleepHint");
  $("#zetkopie").disabled=$("#zetbestand").disabled=$("#zetterug").disabled=!bewerkt;
}
function bewaar(){
  bewerkt++;
  try{localStorage.setItem("gj-data",JSON.stringify({data:schoneData(),bewerkt}));}catch(e){}
  toonZetstand();
}
function opgeslagen(bericht){
  bewerkt=0;
  try{localStorage.removeItem("gj-data");}catch(e){}
  toonZetstand(); zetstand.textContent=bericht;
}

/* ---- wat er nu onder handen is ---- */
const SOORTNAAM=TAAL==="nl"
  ?{zee:"Zee",gebied:"Land",plaats:"Naam",punt:"Markering"}
  :{zee:"Sea",gebied:"Country",plaats:"Name",punt:"Marker"};
function toonKeuze(){
  zetsel.hidden=!keuze; if(!keuze)return;
  $("#zetselnaam").textContent=`${SOORTNAAM[keuze.soort]}: ${keuze.d.naam}`;
  /* een markering is een punt: die valt niet te draaien of te vergroten */
  const naam=keuze.soort!=="punt";
  $("#zetdraai").hidden=$("#zetmaat").hidden=$("#zetstd").hidden=!naam;
  $("#zetrot").textContent=(keuze.d.rot||0)+"°";
  /* in procenten, niet in tienden: een stap van 10% zou anders twee keer
     achter elkaar hetzelfde getal opleveren */
  $("#zetmt").textContent=Math.round((keuze.d.maat||1)*100)+"%";
}
function kiesDeel(it){
  for(const n of NAMEN)n.t.classList.remove("naamsel");
  for(const id in markerEls)markerEls[id].g.classList.remove("puntsel");
  keuze=it;
  if(!it){zetsel.hidden=true;return;}
  if(it.soort==="punt")it.m.g.classList.add("puntsel");
  else it.t.classList.add("naamsel");
  toonKeuze();
}
/* een naam opnieuw neerzetten na een verandering */
function pasNaamAan(it){
  if(it.soort==="plaats")zetPlaatsNaam(it.m,it.d); else zetNaamPlek(it);
}

/* ---- draaien en vergroten ---- */
zetsel.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!keuze||keuze.soort==="punt")return;
  const d=keuze.d;
  if(b.dataset.draai){
    let r=(d.rot||0)+ +b.dataset.draai;
    r=((r+180)%360+360)%360-180;          /* netjes tussen -180 en 180 graden */
    if(r)d.rot=r; else delete d.rot;
  } else if(b.dataset.maat){
    const mt=Math.round(Math.min(3,Math.max(.4,(d.maat||1)*(+b.dataset.maat>0?1.1:1/1.1)))*100)/100;
    if(Math.abs(mt-1)<.01)delete d.maat; else d.maat=mt;
  } else return;
  pasNaamAan(keuze); pas(); toonKeuze(); bewaar();
});
$("#zetstd").onclick=()=>{
  if(!keuze||keuze.soort==="punt")return;
  const d=keuze.d;
  delete d.rot; delete d.maat;
  /* een zee heeft geen berekende plek om naar terug te vallen, dus daar
     blijft x/y staan; een plaats- of landnaam gaat terug naar zijn eigen punt */
  if(keuze.soort!=="zee"){delete d.lx; delete d.ly;}
  pasNaamAan(keuze); pas(); toonKeuze(); bewaar();
};
$("#zetlos").onclick=()=>kiesDeel(null);

/* ---- slepen ---- */
const wereldPunt=e=>{
  const u=naarUser(e.clientX,e.clientY);
  return {x:(u.x-view.x)/view.k, y:(u.y-view.y)/view.k};
};
/* Elke naam is op te pakken. Het oppakken van een markering zit in
   maakMarker, zodat ook een plaats die je zelf toevoegt meteen meedoet. */
function hangNaamOp(it){
  it.g.addEventListener("pointerdown",e=>{
    if(!zetten)return;
    e.stopPropagation(); e.preventDefault();
    kiesDeel(it);
    const w=wereldPunt(e);
    const zee=it.soort==="zee";
    sleep={soort:"naam",it,bewogen:0,sx:w.x,sy:w.y,
      ax:zee?it.d.x:(it.d.lx||0), ay:zee?it.d.y:(it.d.ly||0)};
    it.g.classList.add("pak");
    try{it.g.setPointerCapture(e.pointerId);}catch(err){}
  });
}
for(const it of NAMEN)hangNaamOp(it);

addEventListener("pointermove",e=>{
  if(!sleep)return;
  const w=wereldPunt(e);
  sleep.bewogen++;
  if(sleep.soort==="routepunt"){
    const x=+w.x.toFixed(2), y=+w.y.toFixed(2);
    sleep.been[sleep.stapIdx]=[x,y];
    sleep.c.setAttribute("cx",x); sleep.c.setAttribute("cy",y);
    bouwRoutes();
    return;
  }
  if(sleep.soort==="punt"){
    const x=+w.x.toFixed(2), y=+w.y.toFixed(2);
    sleep.m.pos=[x,y];
    sleep.m.g.setAttribute("transform",`translate(${x},${y})`);
    return;
  }
  /* Een plaatsnaam zit in de laag die met de zoom mee terugschaalt, dus daar
     telt de verschuiving in schermpunten; een zee- of landnaam staat gewoon
     in wereldmaat. */
  const it=sleep.it, f=it.soort==="plaats"?view.k:1;
  const nx=+(sleep.ax+(w.x-sleep.sx)*f).toFixed(2);
  const ny=+(sleep.ay+(w.y-sleep.sy)*f).toFixed(2);
  if(it.soort==="zee"){it.d.x=nx; it.d.y=ny;} else {it.d.lx=nx; it.d.ly=ny;}
  pasNaamAan(it);
},{passive:true});

addEventListener("pointerup",()=>{
  if(!sleep)return;
  const s=sleep; sleep=null;
  if(s.soort==="routepunt"){
    s.c.classList.remove("pak");
    if(s.bewogen>=2)bewaar();
    bouwRoutepunten();
    return;
  }
  if(s.soort==="naam"){
    s.it.g.classList.remove("pak");
    if(s.bewogen>=2){
      /* een verschuiving van niets hoeft niet in het bestand te staan */
      const d=s.it.d;
      if(s.it.soort!=="zee"){if(!d.lx)delete d.lx; if(!d.ly)delete d.ly;}
      bewaar();
    }
    pas(); return;
  }
  s.m.g.classList.remove("pak");
  if(s.bewogen>=2){
    /* De plek wordt nu de plek in data.json. rel en detail zijn daarmee van
       de baan — die rekenden hem uit — en geenSnap houdt hem precies waar jij
       hem neerlegt in plaats van hem het dichtstbijzijnde land in te schuiven. */
    const p=s.p;
    delete p.rel; delete p.detail;
    p.x=s.m.pos[0]; p.y=s.m.pos[1]; p.geenSnap=1;
    delete plekCache[p.id];
    bewaar(); verversNaZet();
  }
  kiesDeel({soort:"punt",d:s.p,m:s.m});
});

/* ---- een plaats erbij ---- */
/* in welk gebied ligt dit punt? daarmee komt een nieuwe plaats vanzelf in de
   juiste groep in de zijbalk terecht */
function gebiedOp(x,y){
  for(const id in gebiedEls) if(GEBIEDEN[id]&&inGebied(id,x,y))return id;
  return null;
}
let nieuwAan=false;
$("#zetnieuw").onclick=()=>{
  nieuwAan=!nieuwAan;
  $("#zetnieuw").textContent = nieuwAan ? t("klikOpKaart") : t("nieuwePlaats");
};
svg.addEventListener("click",e=>{
  if(!zetten||!nieuwAan||gesleept())return;
  const w=wereldPunt(e);
  const x=+w.x.toFixed(2), y=+w.y.toFixed(2);
  const naam=prompt(t("vraagNaamPlaats"));
  if(!naam){nieuwAan=false;$("#zetnieuw").textContent=t("nieuwePlaats");return;}
  let id=naam.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"plaats";
  while(byId[id])id+="-2";
  const p={id,naam:naam.trim(),soort:$("#zetsoort").value,gebied:gebiedOp(x,y)||"araluen",
    x,y,geenSnap:1,serie:["GJ"],boeken:[],feiten:[],z:4,
    tekst:t("zelfToegevoegd")};
  PLAATSEN.push(p); plaatsById[p.id]=p; byId[p.id]=p; ALLES.push(p);
  const m=maakMarker(p);
  if(m)hangNaamOp(NAMEN[NAMEN.length-1]);
  bewaar(); verversNaZet(); teken();
  nieuwAan=false; $("#zetnieuw").textContent=t("nieuwePlaats");
});

/* ---- de stand aan- en uitzetten ---- */
function verversNaZet(){ bouwRoutes(); bouwRoutepunten(); pas(); }
function zetModus(aan){
  zetten=aan;
  document.body.classList.toggle("zetten",aan);
  $("#zetaan").textContent = aan ? t("bewerkenAfsluiten") : t("bewerken");
  if(aan){kies(null);toonZetstand();} else kiesDeel(null);
  verversNaZet();   /* ook bij afsluiten: de markeringen mogen weer weg */
}
$("#zetaan").onclick=()=>zetModus(!zetten);
$("#zetklaar").onclick=()=>zetModus(false);
$("#zetterug").onclick=()=>{
  if(!confirm(t("bevestigTerug")))return;
  try{localStorage.removeItem("gj-data");}catch(e){}
  location.reload();
};
$("#zetkopie").onclick=async()=>{
  const tekst=dataTekst();
  try{await navigator.clipboard.writeText(tekst);opgeslagen(t("gekopieerd"));}
  catch(e){open(t("bewerkteKaart"),"data.json",
    `<p>${t("kopieerUitleg")}</p>
     <pre style="white-space:pre-wrap;font-size:12px;background:var(--paper-2);padding:10px;border-radius:4px">${
       tekst.replace(/</g,"&lt;")}</pre>`);}
};
$("#zetbestand").onclick=()=>{
  const blob=new Blob([dataTekst()],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="data.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  opgeslagen(t("opgeslagenAls"));
};

/* knoppen en toetsen */
$("#zin").onclick=()=>zoomOp(W/2,H/2,1.5);
$("#zout").onclick=()=>zoomOp(W/2,H/2,1/1.5);
$("#zfit").onclick=()=>{kies(null);heel(true);};
$("#railtoggle").onclick=()=>$("#rail").classList.toggle("open");

(()=>{
  const root=document.documentElement, btn=$("#themetoggle");
  const opgeslagen=(()=>{try{return localStorage.getItem("gj-thema")}catch(e){return null}})();
  if(opgeslagen==="dark"||opgeslagen==="light") root.dataset.theme=opgeslagen;
  const isDonker=()=>root.dataset.theme
    ? root.dataset.theme==="dark"
    : matchMedia("(prefers-color-scheme:dark)").matches;
  btn.setAttribute("aria-pressed",String(isDonker()));
  btn.onclick=()=>{
    const nieuw=isDonker()?"light":"dark";
    root.dataset.theme=nieuw;
    btn.setAttribute("aria-pressed",String(nieuw==="dark"));
    try{localStorage.setItem("gj-thema",nieuw)}catch(e){}
    /* De kleuren zitten in het reliëfbeeld gebakken, dus dat moet opnieuw. Dat
       kost seconden; herbouw() toont zolang het laadscherm weer, met de kaart
       er vaag doorheen zichtbaar. */
    setTimeout(()=>herbouw("bezigThema"),80);
  };
})();
(()=>{
  /* Taal wisselen raakt vrijwel elke naam en tekst op de kaart tegelijk; in
     plaats van dat overal los te herberekenen, herlaadt de pagina gewoon met
     de nieuwe taal in localStorage — TAAL leest dat aan het begin opnieuw in. */
  const btn=$("#langtoggle");
  btn.textContent=TAAL==="nl"?"EN":"NL";
  btn.setAttribute("aria-label",TAAL==="nl"?"Switch to English":"Overschakelen naar Nederlands");
  btn.onclick=()=>{
    try{
      localStorage.setItem("gj-taal",TAAL==="nl"?"en":"nl");
      /* Zodat de pagina na herladen weet dat dit een taalwissel is en niet
         een eerste bezoek — alleen relevant voor het tekstje onder de titel. */
      sessionStorage.setItem("gj-wissel","taal");
    }catch(e){}
    location.reload();
  };
})();
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const stap=60/view.k;
  if(e.key==="Escape"){kies(null);kiesDeel(null);$("#rail").classList.remove("open");}
  else if(e.key==="+"||e.key==="=")zoomOp(W/2,H/2,1.4);
  else if(e.key==="-")zoomOp(W/2,H/2,1/1.4);
  else if(e.key==="ArrowLeft"){view.x+=stap;begrens();pas();}
  else if(e.key==="ArrowRight"){view.x-=stap;begrens();pas();}
  else if(e.key==="ArrowUp"){view.y+=stap;begrens();pas();}
  else if(e.key==="ArrowDown"){view.y-=stap;begrens();pas();}
  else return;
  e.preventDefault();
});

/* ---- laadscherm ----
   Het opbouwen van de kaart gebeurt in stappen die de browser stuk voor stuk
   bezet houden. Tussen die stappen door moet het scherm even teruggegeven
   worden, anders is er van de voortgang niets te zien.

   Hetzelfde scherm dient twee doelen: bij het eerste bezoek staat het al in
   de HTML (er is nog geen kaart om doorheen te zien); wisselt iemand later
   van taal of kleurstelling, dan wordt het opnieuw ingeschakeld terwijl de
   kaart die er al stond er vaag doorheen blijft schemeren. */
const laadScherm={
  el:$("#laad"), sub:$("#laadsub"),
  aan(subSleutel){
    this.sub.textContent=t(subSleutel);
    this.el.hidden=false;
  },
  weg(){
    this.el.hidden=true;
  }
};

/* Geeft het scherm terug aan de browser en komt pas terug als er ook echt
   geschilderd is. Twee beeldjes, want in het eerste wordt de nieuwe stand pas
   berekend en in het tweede staat hij op het scherm. */
const adem=()=>new Promise(r=>
  requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,0))));

/* Het reliëf opbouwen. Gaat er onderweg iets mis, dan blijft de kaart staan
   zoals hij zonder reliëf was — vandaar dat alles in een vangnet zit. */
async function startGrond(){
  try{
    const t0=performance.now();
    await bouwGrond(async()=>{ await adem(); });
    console.log(`reliëf gebouwd in ${Math.round(performance.now()-t0)} ms`);
  }catch(e){
    document.body.classList.remove("relief");
    console.warn("reliëf overgeslagen:",e);
  }
}

/* --- de opbouw bij het laden van de pagina ---
   Komt de pagina van een taalwissel, dan is het tekstje onder de titel
   anders dan bij een eerste bezoek — verder precies hetzelfde scherm. */
let taalwisselNet=false;
try{
  if(sessionStorage.getItem("gj-wissel")==="taal"){
    sessionStorage.removeItem("gj-wissel");
    taalwisselNet=true;
  }
}catch(e){}
laadScherm.aan(taalwisselNet?"bezigTaal":"laadEerst");
(async()=>{
  await adem();
  teken(); heel(false); kBasis=view.k; pas();
  await adem();
  await startGrond();
  laadScherm.weg();
})();

/* --- opnieuw opbouwen, als de kaart er al staat --- */
async function herbouw(sleutel){
  laadScherm.aan(sleutel);
  await adem();
  await startGrond();
  laadScherm.weg();
}
/* De kleuren zitten in de bitmap gebakken, dus als het stelsel van licht naar
   donker gaat moet het reliëf opnieuw. */
try{
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>setTimeout(startGrond,80));
}catch(e){}
</script>
