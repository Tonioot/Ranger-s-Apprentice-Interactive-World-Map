<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Araluen &amp; de Bekende Wereld</title>
<style>
:root{
  --donker:0;
  --sea:#A3B9BE; --sea-deep:#8CA6AC; --sea-line:#8AA4A9;
  /* de zee loopt in banden van de kust af het diepe in; zee-1 ligt tegen het
     strand aan, zee-diep is de open oceaan */
  --zee-1:#C0CFD1; --zee-2:#B4C5C8; --zee-3:#AABEC2; --zee-diep:#93ADB3;
  --rivier:#7C99A0; --rots:#9C9782; --sneeuw:#F1EFE4; --terrein:#5F6A5C;
  --tone-a:#D6D2B6; --tone-b:#C4CAAE; --tone-c:#E1DBC1; --tone-d:#CDC3A2; --tone-e:#E5D6A9; --tone-f:#BEC9B3;
  --land-base:#D2CEB7; --coast:#5A6356; --halo:#EAE7D9;
  --ink:#222A25; --ink-soft:#5A6159; --ink-faint:#848A7C;
  --paper:#DCDDD2; --paper-2:#E4E4DA; --edge:#B7BAAC;
  --accent:#8A2F27; --accent-soft:#B0554A; --brass:#94794A;
  --route-1:#1F5F6B; --route-2:#6B4A86; --route-3:#8A5A1F;
  --shadow:0 1px 2px rgba(35,42,38,.10),0 8px 24px rgba(35,42,38,.10);
  --font-map:"Iowan Old Style","Hoefler Text","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-ui:-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --donker:1;
  --sea:#0E1A1E; --sea-deep:#0A1215; --sea-line:#1A2A30;
  --zee-1:#1E3238; --zee-2:#17272C; --zee-3:#121F23; --zee-diep:#0A1216;
  --rivier:#4E7B87; --rots:#575A4B; --sneeuw:#B9BFB4; --terrein:#8C9A88;
  --tone-a:#3A422F; --tone-b:#2B352E; --tone-c:#484D3C; --tone-d:#403926; --tone-e:#4D4330; --tone-f:#2E3B33;
  --land-base:#303829; --coast:#7E8C7C; --halo:#0A1215;
  --ink:#D9DDD2; --ink-soft:#9BA497; --ink-faint:#6F7A6E;
  --paper:#151B18; --paper-2:#1C231F; --edge:#2D352F;
  --accent:#CE7264; --accent-soft:#E09183; --brass:#B9995F;
  --route-1:#5FB6C4; --route-2:#B192CE; --route-3:#D0985A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --donker:1;
  --sea:#0E1A1E; --sea-deep:#0A1215; --sea-line:#1A2A30;
  --zee-1:#1E3238; --zee-2:#17272C; --zee-3:#121F23; --zee-diep:#0A1216;
  --rivier:#4E7B87; --rots:#575A4B; --sneeuw:#B9BFB4; --terrein:#8C9A88;
  --tone-a:#3A422F; --tone-b:#2B352E; --tone-c:#484D3C; --tone-d:#403926; --tone-e:#4D4330; --tone-f:#2E3B33;
  --land-base:#303829; --coast:#7E8C7C; --halo:#0A1215;
  --ink:#D9DDD2; --ink-soft:#9BA497; --ink-faint:#6F7A6E;
  --paper:#151B18; --paper-2:#1C231F; --edge:#2D352F;
  --accent:#CE7264; --accent-soft:#E09183; --brass:#B9995F;
  --route-1:#5FB6C4; --route-2:#B192CE; --route-3:#D0985A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
/* Op de kaart geen rechthoekige focusrand: die trekt een enorm kader om het
   hele land heen. De vorm zelf licht op, dat is duidelijker en netter. */
#map .gebied:focus,#map .marker:focus,#map .gebied:focus-visible,#map .marker:focus-visible{outline:none}
.app{display:grid;grid-template-columns:322px 1fr;height:100vh;height:100dvh;width:100%}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;min-height:0;background:var(--paper);
  border-right:1px solid var(--edge);z-index:3}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--edge);flex:none;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-family:var(--font-map);font-size:22px;line-height:1.15;font-weight:600;text-wrap:balance}
.brand p{margin:5px 0 0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.themetoggle{flex:none;display:grid;place-items:center;width:32px;height:32px;margin-top:1px;
  background:none;border:1px solid var(--edge);border-radius:999px;cursor:pointer;color:var(--ink-soft)}
.themetoggle:hover{border-color:var(--ink-faint);color:var(--ink)}
.themetoggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.themetoggle .i-moon{display:none}
:root[data-theme="dark"] .themetoggle .i-sun{display:none}
:root[data-theme="dark"] .themetoggle .i-moon{display:block}
.tools{padding:14px 20px 14px;display:flex;flex-direction:column;gap:16px;flex:none;
  border-bottom:1px solid var(--edge)}
.tools>div{display:flex;flex-direction:column;gap:9px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;width:15px;height:15px;stroke:var(--ink-faint);fill:none;stroke-width:1.6}
.search input{width:100%;padding:8px 10px 8px 32px;background:var(--paper-2);
  border:1px solid var(--edge);border-radius:4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;background:transparent;border:1px solid var(--edge);border-radius:999px;
  font-size:12px;cursor:pointer;color:var(--ink-soft);transition:background .15s,color .15s,border-color .15s}
.chip:hover:not(:disabled){border-color:var(--ink-faint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:0}
.rgrid{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:74px 1fr;gap:9px;align-items:start}
.rgl{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);
  padding-top:6px;line-height:1.3}
.chip.mini{min-width:27px;padding:3px 5px;text-align:center;font-size:11.5px;
  font-family:var(--font-mono);letter-spacing:.02em}
.rcap{margin:2px 0 0;padding:9px 11px;background:var(--paper-2);border-left:2px solid var(--accent);
  border-radius:0 3px 3px 0;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
.rcap b{display:block;color:var(--ink);font-weight:500;font-family:var(--font-map);font-size:13.5px;margin-bottom:2px}
.rcap[hidden]{display:none}

.list{flex:1;overflow-y:auto;padding:6px 0 24px;min-height:0;overscroll-behavior:contain}
.grp{padding:14px 20px 5px;position:sticky;top:0;background:var(--paper);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:0}
.item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:6px 20px;
  background:none;border:0;cursor:pointer;border-left:2px solid transparent}
.item:hover{background:var(--paper-2)}
.item[aria-current="true"]{background:var(--paper-2);border-left-color:var(--accent)}
.item b{font-weight:500;font-size:14px}
.item.wacht b{color:var(--ink-faint)}
.item span{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);white-space:nowrap}
.empty{padding:20px;color:var(--ink-faint);font-size:13px}
.railfoot{flex:none;border-top:1px solid var(--edge);padding:10px 20px 12px;display:flex;flex-direction:column;gap:8px}
.railfoot .links{display:flex;gap:14px;align-items:center}
.railfoot .disclaimer{font-size:10.5px;color:var(--ink-faint)}
.link{background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;color:var(--ink-soft);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--edge)}
.link:hover{color:var(--accent)}
.list,.dbody{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.list::-webkit-scrollbar,.dbody::-webkit-scrollbar{width:11px}
.list::-webkit-scrollbar-track,.dbody::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb,.dbody::-webkit-scrollbar-thumb{
  background:var(--edge);border-radius:99px;border:3.5px solid var(--paper);background-clip:padding-box}
.list::-webkit-scrollbar-thumb:hover,.dbody::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

/* ---------- kaart ---------- */
.stage{position:relative;min-width:0;background:var(--sea);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.ctrl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.ctrl button{width:34px;height:34px;display:grid;place-items:center;background:var(--paper);
  border:1px solid var(--edge);border-radius:4px;cursor:pointer;box-shadow:var(--shadow)}
.ctrl button:hover{border-color:var(--ink-faint)}
.ctrl button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.railtoggle{display:none}

/* ---------- licht en kompas ----------
   Deze twee liggen op het scherm, niet op de kaart: ze schuiven en zoomen niet
   mee. Hier hing eerder ook een korrellaag met een mengstand (mix-blend-mode)
   overheen. Die is eruit: een mengstand dwingt de browser om bij elk beeldje
   de hele kaart eronder terug te lezen, en dat maakte het schuiven stroperig.
   De korrel zit nu in het reliëfbeeld zelf, waar hij niets kost. */
/* een zachte inval van licht: in het midden helder, naar de randen toe dieper */
.vignet{position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 160px 24px rgba(28,36,32,.16)}
:root[data-theme="dark"] .vignet{box-shadow:inset 0 0 180px 30px rgba(0,0,0,.42)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vignet{
  box-shadow:inset 0 0 180px 30px rgba(0,0,0,.42)}}
.roos{position:absolute;left:18px;bottom:16px;width:74px;height:74px;z-index:2;
  pointer-events:none;opacity:.5}
.roos .rl{fill:var(--paper)}
.roos .rd{fill:var(--ink-soft)}
.roos .rr{fill:none;stroke:var(--ink-soft);stroke-width:1.1}
.roos .rn{fill:var(--ink-soft);font-family:var(--font-map);font-size:11px;font-weight:600;
  letter-spacing:.06em}

/* ---------- bewerkstand ---------- */
.zetbalk{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:5;display:none;
  flex-direction:column;gap:8px;padding:8px 10px 8px 14px;background:var(--paper);
  border:1px solid var(--edge);border-radius:6px;box-shadow:var(--shadow);font-size:13px;
  max-width:calc(100vw - 32px)}
body.zetten .zetbalk{display:flex}
.zrij{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.zsel{border-top:1px solid var(--edge);padding-top:8px;gap:14px}
.zscheid{width:1px;align-self:stretch;background:var(--edge)}
.zgroep{display:flex;align-items:center;gap:4px}
.zlbl{color:var(--ink-faint);font-size:12px;margin-right:2px}
.zgroep output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px}
.zgroep button{padding:3px 8px!important;min-width:28px}
.zetbalk b{font-weight:500}
.zetbalk em{font-style:normal;color:var(--ink-faint);font-size:12px}
.zetbalk select{padding:5px 6px;background:var(--paper-2);border:1px solid var(--edge);border-radius:4px;font-size:12.5px}
.zetbalk button{padding:5px 11px;background:var(--paper-2);border:1px solid var(--edge);
  border-radius:4px;cursor:pointer;font-size:12.5px}
.zetbalk button:hover{border-color:var(--ink-faint)}
.zetbalk button.klaar{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.zetbalk button:disabled{opacity:.4;cursor:not-allowed}
body.zetten .marker{cursor:grab}
body.zetten .marker.pak{cursor:grabbing}
body.zetten .marker .glyph{stroke:var(--accent)}
/* In de bewerkstand blijven alle markeringen staan, maar de namen volgen de
   gewone regels: alles tegelijk tonen maakt van een eiland vol plaatsen één
   zwarte kluwen, en juist een naam moet je kunnen aanwijzen. Zoom in en de
   namen komen vanzelf. Wat je onder handen hebt is altijd te lezen. */
body.zetten .marker.puntsel .mlabel,.mlabel.naamsel{opacity:1}
body.zetten .gebied{pointer-events:none}
/* Een landnaam laat de klik door naar het land eronder, zodat je een land ook
   op zijn naam kunt aanwijzen. Onder een zeenaam ligt niets, dus die vangt de
   klik zelf op — anders zou een zee nergens aan te wijzen zijn. */
.t-gebied{pointer-events:none}
.t-zee{cursor:pointer}
.t-zee.sel{fill:var(--accent);opacity:1}
body.zetten .t-zee,body.zetten .t-gebied,body.zetten .mlabelg{pointer-events:auto;cursor:grab}
body.zetten .pak .mlabelg,body.zetten .mlabelg.pak{cursor:grabbing}
.naamsel{fill:var(--accent)!important;stroke-width:3.5px}
.marker.puntsel .glyph{stroke:var(--accent)!important}
.marker.puntsel .glyph .solid{fill:var(--accent)!important}

/* ---------- detail ---------- */
.detail{position:absolute;top:0;right:0;height:100%;width:378px;max-width:100%;background:var(--paper);
  border-left:1px solid var(--edge);box-shadow:var(--shadow);z-index:4;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);visibility:hidden}
.detail.open{transform:none;visibility:visible}
.dhead{padding:20px 22px 16px;border-bottom:1px solid var(--edge);flex:none;position:relative}
.dclose{position:absolute;top:14px;right:14px;width:28px;height:28px;border:0;background:none;cursor:pointer;
  color:var(--ink-faint);font-size:19px;line-height:1;border-radius:4px}
.dclose:hover{color:var(--accent);background:var(--paper-2)}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
.dhead h2{margin:0;font-family:var(--font-map);font-size:26px;line-height:1.15;font-weight:600;
  padding-right:32px;text-wrap:balance}
/* Het paneel houdt zelf zijn zijmarge; alleen de afbeelding breekt eruit met
   negatieve marges. Andersom (marge op de losse kinderen) ging mis, want de
   feitentabel en de boekchips zetten hun eigen marge en verloren hem dan. */
.dbody{flex:1;overflow-y:auto;padding:18px 22px 40px;min-height:0;overscroll-behavior:contain}
.dbody p{margin:0 0 14px;max-width:60ch}
.beeld{margin:0 -22px 18px;position:relative;background:var(--paper-2)}
.beeld:first-child{margin-top:-18px}
.beeld img{display:block;width:100%;height:210px;object-fit:cover;border-bottom:1px solid var(--edge)}
.beeld figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 22px 8px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#F2EFE4;
  background:linear-gradient(transparent,rgba(12,16,14,.72))}
.note{display:flex;gap:8px;padding:9px 11px;background:var(--paper-2);border-left:2px solid var(--brass);
  border-radius:0 3px 3px 0;font-size:12.5px;color:var(--ink-soft);margin:0 0 16px}
.legalbox{font-size:12.5px;color:var(--ink-soft);line-height:1.6;padding-bottom:16px;
  margin:0 0 18px;border-bottom:1px solid var(--edge)}
.legalbox p{margin:0 0 10px}
.legalbox p:last-child{margin-bottom:0}
.legalbox strong{color:var(--ink)}
.facts{margin:0 0 18px;padding:0;list-style:none;border-top:1px solid var(--edge)}
.facts div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--edge);
  font-size:13.5px;align-items:baseline}
.facts dt{color:var(--ink-faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.facts dd{margin:0}
.books{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 20px}
.book{display:flex;align-items:center;gap:7px;padding:3px 9px 3px 3px;border:1px solid var(--edge);
  border-radius:999px;font-size:12.5px;color:var(--ink-soft)}
.book i{font-family:var(--font-mono);font-style:normal;font-size:10px;background:var(--paper-2);
  border-radius:999px;padding:2px 7px;color:var(--ink)}
.legend{display:grid;gap:9px}
.lrow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--ink-soft)}
.lrow svg{width:30px;height:22px;overflow:visible}
.lrow .glyph .solid{fill:var(--ink);stroke:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:absolute;inset:0 auto 0 0;width:min(322px,86vw);transform:translateX(-101%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .railtoggle{display:grid;position:absolute;left:16px;top:16px;z-index:2;width:38px;height:38px;
    place-items:center;background:var(--paper);border:1px solid var(--edge);border-radius:4px;
    box-shadow:var(--shadow);cursor:pointer}
  .railtoggle svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round}
  .detail{top:auto;bottom:0;width:100%;height:min(64dvh,520px);border-left:0;border-top:1px solid var(--edge);
    transform:translateY(101%);border-radius:10px 10px 0 0}
  .ctrl{bottom:auto;top:16px}
  /* op een smal scherm schuift het zijpaneel van onderen omhoog en zou het
     kompas eronder verdwijnen; dan liever helemaal weg */
  .roos{display:none}
}

/* ---------- kaartonderdelen ---------- */
.gebied{cursor:pointer}
/* Zodra het reliëf getekend is neemt dat de kleur van het land over en wordt
   dit vlak onzichtbaar. Het blijft wel liggen: het vangt de klik op en het is
   waar de kaart aan rekent — welk punt in welk land ligt, waar de ruimste plek
   voor een landnaam zit. pointer-events:all zorgt dat een onzichtbaar vlak nog
   steeds aan te wijzen is. Lukt het reliëf niet, dan is dit gewoon de kaart
   zoals hij was. */
.gebied .vlak{stroke:none;pointer-events:all}
body.relief .gebied .vlak{fill-opacity:0}
/* selectie als eigen markeerlaag in plaats van een felheidsfilter: dat laatste
   maakt de landkleur vaal en vies */
.gebied .mark{fill:var(--accent);fill-opacity:0;stroke:var(--accent);stroke-width:0;
  stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;
  transition:fill-opacity .18s,stroke-width .18s}
.gebied:hover .mark{fill-opacity:.07}
.gebied.sel .mark{fill-opacity:.15;stroke-width:1.5}
.gebied:focus-visible .mark{fill-opacity:.12;stroke-width:1.5;stroke-dasharray:5 3}
.marker:focus-visible .ring{opacity:.85}
/* De kustlijn ligt onder de landvlakken en is dubbel zo dik. Daardoor steekt
   alleen de buitenste helft uit voorbij de kust, en wordt de binnenste helft
   afgedekt door het land zelf. Op een grens tussen twee landen dekken de buren
   elkaars lijn af, zodat daar geen dubbele streep meer ontstaat. */
.coast{fill:none;stroke:var(--coast);stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
/* De diepte van de zee in banden, zoals in een zeekaart. Elke band is een
   dikke streep langs de kust; de volgende, dunnere streep overschildert het
   midden van de vorige, zodat er scherpe randen tussen de banden overblijven.
   Het is dus vectorwerk: bij elke zoomstap even scherp. Het loopt van licht
   ondiep water tegen het strand naar het donkere open water.

   De strepen houden hun dikte in schermpunten in plaats van in kaarteenheden.
   Op het overzicht is dat hetzelfde, maar ingezoomd scheelt het enorm: een
   streep van vierendertig eenheden is bij zes keer inzoomen ruim tweehonderd
   punten breed, en zo'n brede streep langs een grillige kust laten uitrekenen
   bij elk beeldje is wat het schuiven zwaar maakte. */
.band{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.band1{stroke:var(--zee-3);stroke-width:34}
.band2{stroke:var(--zee-2);stroke-width:17}
.band3{stroke:var(--zee-1);stroke-width:7}
.grens{fill:none;stroke:var(--coast);stroke-width:.5;stroke-dasharray:2.4 2;opacity:.5;vector-effect:non-scaling-stroke}
.grat{stroke:var(--sea-line);stroke-width:.35;opacity:.22;fill:none;vector-effect:non-scaling-stroke}
/* Het reliëf is een bitmap: licht, schaduw, hoogtekleur en de korrel van de
   begroeiing lopen vloeiend in elkaar over en horen niet in lijnen gevat te
   worden. Wat scherp moet blijven — kust, grenzen, rivieren, namen — is vector
   en ligt erbovenop. */
.reliefbeeld{opacity:0;transition:opacity .5s}
body.relief .reliefbeeld{opacity:1}
/* Een dunne kustlijn bovenop het reliëf. De dikke lijn eronder houdt het land
   van de zee gescheiden; deze houdt de rand ook bij het verste inzoomen scherp,
   waar de bitmap zacht wordt. */
/* Hier lag ook een kustlijn bovenop het land. Die is eruit: elk land tekent
   zijn eigen omtrek, en omdat de vormen in world.svg elkaar op de grenzen
   overlappen kwamen daar overal twee lijntjes naast elkaar te liggen. De
   landsgrenzen worden nu in het reliëfbeeld zelf getrokken — daar is per punt
   maar één land, dus daar is ook maar één grens. */
/* rivieren: drie keer hetzelfde pad, elk een stuk korter en een tikje dikker,
   zodat de stroom naar de monding toe aanzwelt zoals een rivier hoort te doen */
.rivier{fill:none;stroke:var(--rivier);stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;opacity:.85}
.rivier.r1{stroke-width:.85}
.rivier.r2{stroke-width:1.4}
.rivier.r3{stroke-width:2.1}
/* Bos, woestijn en steppe staan niet als tekentjes op de kaart maar zitten in
   het reliëfbeeld zelf: als kleur en als korrel. Zie GROEI bij het rekenwerk. */
text{font-family:var(--font-map);paint-order:stroke fill;stroke:var(--halo);stroke-width:3px;
  stroke-linejoin:round;fill:var(--ink);user-select:none}
.t-gebied{font-size:13px;letter-spacing:.28em;text-transform:uppercase;fill:var(--ink-soft);opacity:.9}
.t-zee{font-size:12px;letter-spacing:.3em;font-style:italic;fill:var(--ink-soft);
  stroke:var(--sea);stroke-width:2.4px;opacity:.7}
.t-plaats{font-size:10.5px;fill:var(--ink)}
.t-water{fill:var(--rivier);font-style:italic;letter-spacing:.05em}
.marker{cursor:pointer}
.marker .glyph{stroke:var(--ink);fill:var(--halo);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.marker .glyph .solid{fill:var(--ink);stroke:none}
.marker.approx .glyph{stroke-dasharray:2.4 2}
.marker .hit{fill:transparent;stroke:none}
.marker:hover .glyph,.marker:focus-visible .glyph{stroke:var(--accent)}
.marker:hover .glyph .solid,.marker:focus-visible .glyph .solid{fill:var(--accent)}
.marker.sel .glyph{stroke:var(--accent)}
.marker.sel .glyph .solid{fill:var(--accent)}
.marker.dim{opacity:.2}
.marker.hidden,.marker.weg{display:none}
/* ver uitgezoomd blijven alleen de landnamen over; zie stil() bij het zoomen */
.marker{transition:opacity .3s}
.marker.stil{opacity:0;pointer-events:none}
.mlabel{opacity:0;transition:opacity .18s}
.marker.showlabel .mlabel,.marker:hover .mlabel,.marker:focus-visible .mlabel,.marker.sel .mlabel{opacity:1}
.marker.sel .mlabel{fill:var(--accent);font-weight:600}
.ring{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:0;vector-effect:non-scaling-stroke}
.marker.sel .ring{opacity:.75}
.route{opacity:0;transition:opacity .25s;pointer-events:none}
.route path{fill:none;stroke:inherit;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:5 4;
  vector-effect:non-scaling-stroke}
.route .end{stroke-dasharray:none}
.route.on{opacity:.95}
.route.on path:not(.end){animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.routepunt{display:none;fill:var(--paper);stroke:var(--accent);stroke-width:1.4;r:2.4;
  vector-effect:non-scaling-stroke;cursor:grab}
body.zetten .routepunt{display:block}
body.zetten .routepunt.pak{cursor:grabbing;fill:var(--accent)}
@media (prefers-reduced-motion:reduce){
  .route.on path{animation:none}
  .detail,.rail,.mlabel{transition:none}
}
/* ---------- laadscherm ----------
   Beslaat alleen het kaartgedeelte (.stage), niet de zijbalk: die staat er
   al meteen. Licht doorzichtig, zodat de kaart erachter al waarneembaar
   opdoemt terwijl hij nog getekend wordt. Een kompasje en een balk die
   continu heen en weer glijdt — de duur is niet vooraf bekend, dus geen
   balk die "klaar" belooft. Geen los kaartje eromheen: het staat gewoon op
   de overlay, net als de rest.

   Dezelfde opmaak wordt ook gebruikt bij het herbouwen ná het eerste bezoek
   (andere taal of kleurstelling): dan blijft de kaart zichtbaar onder de
   doorzichtige laag, maar verder is het precies hetzelfde scherm — niet een
   los, ander soort berichtje. Staat in de HTML zelf (niet door het script
   aangemaakt): het opbouwen blokkeert de browser, dus iets dat het script
   zelf zou aanmaken zou pas ná afloop verschijnen. */
.laad{position:absolute;inset:0;z-index:50;display:grid;place-items:center;
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:1;visibility:visible;
  transition:opacity .5s ease,visibility .5s}
.laad[hidden]{display:grid!important;opacity:0;visibility:hidden;pointer-events:none}
.laadvak{display:flex;flex-direction:column;align-items:center;gap:20px}

/* Dezelfde tekening als het kompasje op de kaart zelf (.roos): een achtpuntige
   roos met om en om een licht en een donker vlak per punt. Hier voluit
   zichtbaar (geen .5 opacity) en met de noordpunt in de accentkleur, zodat
   hij als blikvanger op zichzelf kan staan. */
.laadroos{width:72px;height:72px;overflow:visible}
.laadroos .lr{fill:none;stroke:var(--ink-soft);stroke-width:1;opacity:.6}
.laadroos .ll{fill:var(--paper-2)}
.laadroos .ld{fill:var(--ink-soft);opacity:.8}
.laadroos .lnoord-p{fill:var(--accent)}
.laadroos .lspil{fill:var(--paper);stroke:var(--ink-soft);stroke-width:1}
.laadroos .lnoord{fill:var(--ink-soft);font-family:var(--font-map);font-size:10px;
  font-weight:600;letter-spacing:.08em}

.laadtitel{margin:0;font-family:var(--font-map);font-size:18px;font-weight:600;
  letter-spacing:.01em;color:var(--ink)}
.laadsub{margin:-12px 0 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft)}

/* Indeterminate: geen percentage, gewoon een streepje dat blijft heen-en-weer
   glijden zolang het laadscherm er staat — eerlijker dan een balk doen alsof
   hij weet hoe lang het nog duurt. */
.laadbalk{width:150px;height:3px;background:var(--edge);border-radius:99px;overflow:hidden}
.laadbalk i{display:block;height:100%;width:38%;border-radius:99px;
  background:linear-gradient(90deg,var(--brass),var(--accent));

  100%{transform:translateX(365%)}
}

<script>

<!-- type=module, want een module draait pas nadat de HTML geparseerd is.
     Dat is hier geen detail maar de kern: zonder dit uitstel zou de browser
     het laadscherm hierboven nooit geschilderd krijgen — je zou al die tijd
     naar een leeg venster kijken. Het script hieronder haalt world.svg en
     data.json eerst asynchroon op (blokkeert niet), en bouwt de kaart en het
     reliëf daarna nog in een paar blokkerende seconden op. Een module heeft
     ook zijn eigen bereik, dus alle namen hieronder blijven binnen dit blok;
     top-level await mag hier ook, dat kan alleen in een module. -->
<script type="module">
/* ================= de kaart inlezen: world.svg en data.json =================
   Beide bestanden staan los naast kaart.html en worden hier rechtstreeks
   opgehaald — geen ingebakken kopie meer. Dat betekent dat deze pagina via
   een webserver moet draaien (bijvoorbeeld `npx serve` in deze map): met
   dubbelklik openen (file://) mag de browser geen ander bestand van schijf
   lezen en blijft de kaart leeg. Beide verzoeken lopen tegelijk, en de
   module wacht er hier op met een top-level await — de rest van het
   bestand draait pas als beide binnen zijn, precies zoals voorheen met de
   ingebakken kopie, maar nu zonder de hoofdthread te blokkeren.

     world.svg    de landvormen. Elk <path id="..."> is een gebied; een
                  <g id="..."> met paden erin wordt samengevoegd tot een
                  gebied. Zo groeit de kaart mee zodra er landen bijkomen.
     data.json    alle inhoud: boeken, gebieden, zeeën, de detailkaart van
                  Araluen, de plaatsen en de reisroutes. Dit bestand is ook
                  in de kaart zelf te bewerken — knop Bewerken linksonder —
                  en daar weer op te slaan; de volgende herlaadbeurt leest
                  het meteen weer in.                                      */
function leesSvg(tekst){
  const vormen={}, stapel=[];
  const re=/<(g|path|\/g)\b([^>]*)>/g;
  let m;
  while((m=re.exec(tekst))){
    const tag=m[1], attr=m[2]||"";
    if(tag==="/g"){stapel.pop();continue;}
    const id=(attr.match(/\bid="([^"]+)"/)||[])[1];
    if(tag==="g"){stapel.push(id||null);continue;}
    const d=(attr.match(/\bd="([^"]+)"/)||[])[1];
    if(!d)continue;
    const groep=[...stapel].reverse().find(Boolean);
    const naam=(id||groep||"").replace(/_+$/,"");
    if(!naam)continue;
    (vormen[naam]=vormen[naam]||[]).push(d);
  }
  return vormen;
}
const [svgTekst,DATA]=await Promise.all([
  fetch("world.svg").then(r=>r.text()),
  fetch("data.json").then(r=>r.json()),
]);
const vb=(svgTekst.match(/viewBox="([^"]+)"/)||[])[1];
const [,,VW,VH]=(vb||"0 0 1080 644").split(/\s+/).map(Number);
const GEO={vw:VW,vh:VH,vormen:leesSvg(svgTekst)};


/* ---- taal ----
   Vertaalbare tekst staat in data.json als {"nl":"...","en":"..."} in plaats
   van een kale string. Deze stap loopt eenmalig door DATA heen en vervangt
   elk taalobject door de tekst van de gekozen taal, zodat de rest van de
   code — die overal gewoon .naam/.tekst/... als string verwacht — nergens
   hoeft te weten dat een veld tweetalig is. Standaard Engels; het onthouden
   gebeurt net als bij het thema in localStorage. */
const TAAL=(()=>{
  try{
    const o=localStorage.getItem("gj-taal");
    if(o==="nl"||o==="en")return o;
  }catch(e){}
  return "en";
})();
function isTaalObject(v){
  return v&&typeof v==="object"&&!Array.isArray(v)
    &&typeof v.nl==="string"&&typeof v.en==="string"
    &&Object.keys(v).length===2;
}
function vertaal(v){
  if(Array.isArray(v)){ for(let i=0;i<v.length;i++)v[i]=vertaal(v[i]); return v; }
  if(v&&typeof v==="object"){
    if(isTaalObject(v))return v[TAAL];
    for(const k in v)v[k]=vertaal(v[k]);
    return v;
  }
  return v;
}
/* Wat je in de bewerkstand verandert gaat rechtstreeks in DATA, en de hele
   stand wordt in deze browser bewaard zodat een verversing je werk niet
   weggooit. Sla je hem op als data.json, dan gaat die kopie weg: anders zou
   hij het bestand dat je zojuist hebt ingebakken blijven overstemmen. Dit
   moet vóór vertaal() gebeuren: de bewaarde stand staat, net als data.json
   zelf, nog tweetalig in localStorage (schoneData() bewaart hem zo) — pas
   je hem toe ná het platslaan, dan overschrijft de ene taal de andere. */
let bewerkt=0;                   /* veranderingen sinds het laatst opslaan */
try{
  const b=JSON.parse(localStorage.getItem("gj-data")||"null");
  if(b&&b.data&&b.data.plaatsen){Object.assign(DATA,b.data);bewerkt=b.bewerkt||0;}
}catch(e){}

/* Bewaard vóór vertaal() de brontekst platslaat: hierin blijven naam/tekst
   altijd tweetalig staan. Bewerken (slepen, roteren, een been aanpassen)
   muteert de vertaalde DATA; terugvertaal() na afloop verwerkt zo'n
   wijziging in RUWDATA zonder de andere taal te verliezen — anders zou
   "Opslaan als data.json" na één sleepje de niet-actieve taal wissen. */
const RUWDATA=JSON.parse(JSON.stringify(DATA));
vertaal(DATA);
document.documentElement.lang=TAAL;
document.title=TAAL==="nl"?"Araluen & de Bekende Wereld":"Araluen & the Known World";

/* Alle vaste UI-tekst die niet uit data.json komt: knoppen, labels, kopjes,
   soort-namen. U[key] geeft de tekst in de actieve taal. */
const U={
  merknaam:{nl:"Araluen & de Bekende Wereld",en:"Araluen & the Known World"},
  merkserie:{nl:"De Grijze Jager · Broederband",en:"Ranger's Apprentice · Brotherband"},
  themeToggle:{nl:"Wissel tussen licht en donker thema",en:"Switch between light and dark theme"},
  zoekPlaceholder:{nl:"Zoek een plaats of land…",en:"Search a place or country…"},
  zoekLabel:{nl:"Zoek een plaats of land",en:"Search a place or country"},
  lblReeks:{nl:"Reeks",en:"Series"},
  lblRoutes:{nl:"Reisroutes — kies een boek",en:"Travel routes — pick a book"},
  overDezeKaart:{nl:"Over deze kaart",en:"About this map"},
  footerDisclaimer:{nl:"Onofficieel fanproject. Alle rechten op deze wereld berusten bij John Flanagan en zijn uitgevers.",en:"Unofficial fan project. All rights to this world remain with John Flanagan and his publishers."},

const t=k=>{ const v=U[k]; return v?v[TAAL]:k; };
/* Vult alle statische HTML met data-t/data-t-attr/data-t-aria in de actieve
   taal. Loopt bij het laden één keer over de hele pagina — losse elementen
   hoeven dan zelf niets met TAAL te doen. */
function pasTaalToe(){
  for(const e of document.querySelectorAll("[data-t]"))e.textContent=t(e.dataset.t);
  for(const e of document.querySelectorAll("[data-t-aria]"))e.setAttribute("aria-label",t(e.dataset.tAria));
  for(const e of document.querySelectorAll("[data-t-attr]")){
    const [attr,key]=e.dataset.tAttr.split(":");
    e.setAttribute(attr,t(key));
  }
}
pasTaalToe();

/* De open zee loopt donkerder naar de randen. Het vlak is drie keer zo groot

{

const gebiedEls={};
/* Een vorm uit world.svg hoort bij een gebied uit GEBIEDEN, of — zoals bij
   Skorghijl — bij een losse plaats die zijn eigen eiland heeft. In beide
   gevallen is de vorm zelf aanklikbaar, niet alleen de markering erop. */
for(const id in GEO.vormen){
  const meta=GEBIEDEN[id];
  const plaatsVorm=meta?null:PLAATSEN.find(p=>p.vorm===id);
  const naam=meta?meta.naam:(plaatsVorm?plaatsVorm.naam:id);
  const doel=meta?"gebied:"+id:(plaatsVorm?plaatsVorm.id:null);
  const tint=meta?meta.tint:(plaatsVorm&&plaatsVorm.tint?plaatsVorm.tint:"a");
  const paden=GEO.vormen[id];
  const g=el("g",{class:"gebied",tabindex:doel?"0":"-1",role:doel?"button":"presentation",
    "aria-label":naam},gVlak);
  /* De banden gaan van breed naar smal, elk in een lichtere tint: de smallere
     streep overschildert het midden van de bredere, zodat er langs de kust
     drie duidelijke dieptetreden overblijven. Alle banden van alle landen
     eerst, daarna pas de kustlijnen — anders zou de band van de buurman over
     de kustlijn van dit land heen komen te liggen. */
  for(const d of paden){
    el("path",{d,class:"band band1"},gBand1);
    el("path",{d,class:"band band2"},gBand2);
    el("path",{d,class:"band band3"},gBand3);
    el("path",{d,class:"vlak",fill:`var(--tone-${tint})`},g);
    el("path",{d,class:"mark"},g);
    el("path",{d,class:"coast"},gLijn);
  }
  gebiedEls[id]=g;
  if(doel){
    g.addEventListener("click",e=>{e.stopPropagation();if(!gesleept())kies(doel);});
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();kies(doel);}});
  }else g.style.pointerEvents="none";
}

/* ---- inpassing van de Araluen-detailkaart ----
   De omtrek die in world.svg staat is leidend; de punten uit de detailkaart
   worden daar met behoud van verhouding in gepast. Wordt het eiland opnieuw
   getekend, dan schuiven de plaatsen vanzelf mee.                          */
let pasIn=(p)=>p;
(function(){
  const hulp=el("g",{},svg);
  let n=0;
  for(const id of DETAIL.gebieden) if(GEO.vormen[id]) for(const d of GEO.vormen[id]){el("path",{d},hulp);n++;}
  if(!n){hulp.remove();return;}
  const b=hulp.getBBox(); hulp.remove();
  const [bx0,by0,bx1,by1]=DETAIL.bron;
  const bw=bx1-bx0, bh=by1-by0;
  const f=Math.min(b.width/bw,b.height/bh);
  const dx=b.x+(b.width-bw*f)/2, dy=b.y+(b.height-bh*f)/2;
  pasIn=([x,y])=>[+(dx+(x-bx0)*f).toFixed(2),+(dy+(y-by0)*f).toFixed(2)];
})();
/* Ligt een punt binnen het pad van zijn eigen land? Zo niet, dan zoekt het
   script spiraalsgewijs de dichtstbijzijnde plek die er wel in ligt. Daardoor
   belandt geen enkele stad in zee, ook niet als jij de kust verlegt. */
const svgPt=svg.createSVGPoint();
function inGebied(id,x,y){
  const g=gebiedEls[id]; if(!g)return false;
  svgPt.x=x; svgPt.y=y;
  for(const pad of g.querySelectorAll("path.vlak"))
    if(pad.isPointInFill(svgPt))return true;
  return false;
}
function opLand(id,x,y){
  if(!gebiedEls[id]||inGebied(id,x,y))return [x,y];
  for(let r=1;r<=80;r++){
    const n=Math.max(8,r*8);
    for(let a=0;a<n;a++){
      const t=a/n*Math.PI*2, nx=x+Math.cos(t)*r, ny=y+Math.sin(t)*r;
      if(inGebied(id,nx,ny))return [+nx.toFixed(1),+ny.toFixed(1)];
    }
  }
  return [x,y];
}
const plekCache={};
/* Drie manieren om een plaats te plaatsen:
   rel    — als deel van de omhullende doos van een vorm uit world.svg. Handig
            voor kleine gebieden waar de detailkaart van het hele eiland te
            grof voor is; verplaats jij de vorm, dan schuift de plaats mee.
   detail — punt uit de Araluen-detailkaart, ingepast in jouw eilandvorm.
   x,y    — vaste plek, die daarna zijn eigen land in wordt geschoven, tenzij
            geenSnap gezet is: dan blijft hij precies staan waar hij staat.
            Wat je in de bewerkstand versleept komt zo in data.json terecht. */
function plek(p){
  if(plekCache[p.id]!==undefined)return plekCache[p.id];
  let r=null;
  if(p.rel&&gebiedEls[p.rel[0]]){
    const b=gebiedEls[p.rel[0]].getBBox();
    const x=+(b.x+b.width*p.rel[1]).toFixed(2), y=+(b.y+b.height*p.rel[2]).toFixed(2);
    /* De Spleet is juist de kloof zelf: die hoort in de opening tussen het
       land te blijven staan en mag niet naar de dichtstbijzijnde kust worden
       geschoven, zoals bij steden wel de bedoeling is. */
    r=p.geenSnap?[x,y]:opLand(p.gebied,x,y);
  }
  else if(p.detail&&DETAIL.punten[p.detail])r=pasIn(DETAIL.punten[p.detail]);
  else if(p.x!=null)r=p.geenSnap?[p.x,p.y]:opLand(p.gebied,p.x,p.y);
  return (plekCache[p.id]=r);
}

/* ---- namen van gebieden en zeeën ----
   Een naam bestaat uit twee lagen: een <g> met de plek en de draaiing, en
   daarin een <text> met de maat. Dat scheelt rekenwerk — de maat verandert
   bij elke zoomstap mee, de plek niet — en het is precies de verdeling die
   de bewerkstand nodig heeft. Alles wat hier langskomt gaat in NAMEN en is
   daarmee te pakken, te verslepen, te draaien en te vergroten.           */
const gLbl=el("g",{},world), gebiedLabels=[], zeeLabels=[], NAMEN=[];
function label(txt,cls,soort,d){
  const g=el("g",{},gLbl);
  const t=el("text",{class:cls,"text-anchor":"middle"},g);
  t.textContent=txt;
  const it={soort,d,g,t};
  NAMEN.push(it); return it;
}
/* d.lx/d.ly verschuiven de naam, d.rot draait hem. Bij een zee is er geen
   berekende plek en zijn d.x/d.y de plek zelf. */
function zetNaamPlek(it){
  if(it.soort==="zee"){it.x=it.d.x; it.y=it.d.y;}
  else {it.x=it.bx+(it.d.lx||0); it.y=it.by+(it.d.ly||0);}
  it.g.setAttribute("transform",`translate(${it.x},${it.y}) rotate(${it.d.rot||0})`);
}
/* Het midden van de omhullende doos ligt bij een grillig land vaak scheef of
   zelfs in zee. Dit zoekt het punt dat het verst van elke kust af ligt — het
   ruimste plekje binnen de vorm — door een rooster over het gebied te leggen
   en per vakje de afstand tot de rand te schatten. Daarnaast meet het hoeveel
   ruimte er op die hoogte opzij is; dat bepaalt hoe groot de naam mag worden. */
function visueelMidden(groep,obstakels){
  const b=groep.getBBox();
  if(!b.width||!b.height)return null;
  const N=34, sx=b.width/N, sy=b.height/N;
  const paden=[...groep.querySelectorAll("path.vlak")];
  const land=new Uint8Array((N+2)*(N+2));
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    svgPt.x=b.x+(i+.5)*sx; svgPt.y=b.y+(j+.5)*sy;
    for(const p of paden) if(p.isPointInFill(svgPt)){land[(j+1)*(N+2)+i+1]=1;break;}
  }
  const binnen=land.slice();
  /* markeringen tellen als bezet, zodat de landnaam de rustigste hoek opzoekt
     in plaats van boven op een cluster kastelen te belanden */
  for(const [ox,oy] of obstakels||[]){
    const i=Math.round((ox-b.x)/sx), j=Math.round((oy-b.y)/sy);
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
      const ni=i+di+1, nj=j+dj+1;
      if(ni>0&&nj>0&&ni<=N&&nj<=N)binnen[nj*(N+2)+ni]=0;
    }
  }
  /* afstand tot de rand, in twee vegen over het rooster geschat */
  const d=new Float32Array((N+2)*(N+2));
  for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){
    const k=j*(N+2)+i;
    d[k]=binnen[k]?Math.min(d[k-1],d[k-(N+2)],d[k-(N+2)-1]+1.4,d[k-(N+2)+1]+1.4)+1:0;
  }
  let best=0,bi=0,bj=0;
  for(let j=N;j>=1;j--)for(let i=N;i>=1;i--){
    const k=j*(N+2)+i;
    if(!binnen[k]){d[k]=0;continue;}
    d[k]=Math.min(d[k],d[k+1]+1,d[k+(N+2)]+1,d[k+(N+2)+1]+1.4,d[k+(N+2)-1]+1.4);
    if(d[k]>best){best=d[k];bi=i;bj=j;}
  }
  if(!best)return {x:b.x+b.width/2,y:b.y+b.height/2,breed:b.width};
  /* Hoe groot de naam mag worden hangt niet af van de ruimste cirkel maar van
     de ruimte opzij: een naam loopt nu eenmaal horizontaal. Bij een langgerekt
     land als Araluen scheelt dat een factor. Gemeten wordt naar links en naar
     rechts vanaf het gekozen punt, en het kortste van de twee telt dubbel,
     zodat de naam — die om dat punt gecentreerd staat — aan geen van beide
     kanten de kust over gaat. Markeringen tellen hier niet mee: landnamen
     krijgen voorrang, ontwar() laat de markeringen ervoor wijken. */
  let l=0,r=0;
  while(land[bj*(N+2)+bi-l-1])l++;
  while(land[bj*(N+2)+bi+r+1])r++;
  return {x:b.x+(bi-.5)*sx, y:b.y+(bj-.5)*sy, breed:(2*Math.min(l,r)+1)*sx};
}

  }
}

const gRoutes=el("g",{},world), routeEls={};
const plaatsById={}; for(const p of PLAATSEN)plaatsById[p.id]=p;
const opKaart=p=>!p.wacht && plek(p)!==null;
function beenPunten(been){
  const uit=[];
  for(const stap of been){
    if(Array.isArray(stap)){uit.push(stap);continue;}
    const p=plaatsById[stap]; if(!p||!opKaart(p))return null;
    uit.push(plek(p));
  }
  return uit;
}
/* Een reis loopt niet langs een liniaal. Door de punten van een been wordt een
   vloeiende lijn getrokken in plaats van rechte stukken met knikken: een
   Catmull-Rom-kromme, omgezet naar de bezierkrommen die SVG kent. De spanning
   staat bewust onder de volle waarde — een te losse kromme schiet in een bocht
   door en zou een schip alsnog het strand op sturen. */
const SPANNING=.75;
function vloeiend(p){
  if(p.length<3)return "M"+p.map(q=>q.join(" ")).join("L");
  const n=p.length;
  let d="M"+p[0].join(" ");
  for(let i=0;i<n-1;i++){
    const p0=p[i-1]||p[0], p1=p[i], p2=p[i+1], p3=p[i+2]||p[n-1];
    const c=(a,b,e,f)=>[+(b[0]+(e[0]-a[0])/6*SPANNING).toFixed(2),
                        +(b[1]+(e[1]-a[1])/6*SPANNING).toFixed(2)];
    const c1=c(p0,p1,p2), c2=[+(p2[0]-(p3[0]-p1[0])/6*SPANNING).toFixed(2),
                              +(p2[1]-(p3[1]-p1[1])/6*SPANNING).toFixed(2)];
    d+=`C${c1[0]} ${c1[1]},${c2[0]} ${c2[1]},${p2[0]} ${p2[1]}`;
  }
  return d;
}

/* opnieuw op te bouwen, want een plaats die je verzet verlegt ook haar routes */
function bouwRoutes(){
  gRoutes.textContent="";
  for(const r of ROUTES){
    r.paden=r.benen.map(beenPunten);
    r.kanNiet=r.paden.some(p=>!p);
    const g=el("g",{class:"route",stroke:RGRP[r.grp].kleur},gRoutes);
    if(!r.kanNiet)for(const pad of r.paden){
      el("path",{d:vloeiend(pad)},g);
      el("circle",{class:"end",cx:pad[0][0],cy:pad[0][1],r:1.6,fill:RGRP[r.grp].kleur},g);
      const z=pad[pad.length-1];
      el("circle",{class:"end",cx:z[0],cy:z[1],r:2.4,fill:"none",stroke:RGRP[r.grp].kleur,"stroke-width":1},g);
    }
    if(r.id===state.route)g.classList.add("on");
    routeEls[r.id]=g;
  }
}

/* ---- route-tussenpunten verslepen ----
   Alleen de coördinaten in benen zijn hier van belang: een been-stap die een
   plaats-id is, hoort bij die plaats en sleep je via de markering zelf. Om de
   kaart niet vol te zetten met grepen tonen we dit alleen voor de route die
   nu open staat in het zijpaneel. */
const gRoutepunten=el("g",{},world);
function bouwRoutepunten(){
  gRoutepunten.textContent="";
  const r=ROUTES.find(x=>x.id===state.route);
  if(!r)return;
  r.benen.forEach((been,beenIdx)=>{
    been.forEach((stap,stapIdx)=>{
      if(!Array.isArray(stap))return;
      const c=el("circle",{class:"routepunt",cx:stap[0],cy:stap[1]},gRoutepunten);
      c.addEventListener("pointerdown",e=>{
        if(!zetten)return;
        e.stopPropagation(); e.preventDefault();
        sleep={soort:"routepunt",been,stapIdx,c,bewogen:0};
        c.classList.add("pak");
        try{c.setPointerCapture(e.pointerId);}catch(err){}
      });
    });
  });
}

/* Het bordje staat standaard tien punten boven de markering. lx/ly schuiven

   bordje zit in de laag die met de zoom mee terugschaalt. Zo blijft de

function zetPlaatsNaam(m,p){

    `translate(${p.lx||0},${(p.ly||0)-10}) rotate(${p.rot||0}) scale(${p.maat||1})`);

  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();kies(p.id);}});
